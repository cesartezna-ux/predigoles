<script>
// --- Supabase (migración en curso, rama supabase-migration) ---
// SUPABASE_ANON_KEY es la llave PÚBLICA, diseñada para ir en el cliente --
// la protección real de los datos la da RLS (negar por defecto salvo
// lectura pública de fixtures/fixture_results/team_crests), no ocultar
// esta llave. La llave de servicio (con acceso total) nunca sale de las
// Edge Functions.
const SUPABASE_URL="https://advdcsdcknschwgfilme.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdmRjc2Rja25zY2h3Z2ZpbG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTQ2ODksImV4cCI6MjEwNTM5MDY4OX0.Dg1z50NpHVMTtEMxuu-eSf1VlkC1U1cKM_hZtv_dL3A";
const FUNCTIONS_URL=SUPABASE_URL+"/functions/v1";
const REST_URL=SUPABASE_URL+"/rest/v1";

/* --- Multi-tenant con soporte para ?grupo= o ?tab= --- */
const _qp=new URLSearchParams(location.search);
// El dominio pelado (predigoles.com o www.predigoles.com, sin ningún parámetro)
// es el que se comparte en marketing -- siempre debe mostrar la landing, sin
// importar si este navegador ya tiene un grupo guardado de una visita previa.
// Se normaliza a la URL canónica /?home=1 (la misma que usa /home/) en vez de
// dejar que el fallback de abajo decida caso por caso.
if(location.search===""){ location.replace("/?home=1"); }
const ES_PANEL_CENTRAL=_qp.get("admin")==="central";
// Formulario público post-compra (Gumroad enlaza aquí desde el recibo):
// recolecta los datos que Panel Central necesita para crear el grupo, sin
// exigir el PIN maestro -- el propio Edge Function valida cada campo.
const ES_SETUP=!ES_PANEL_CENTRAL && _qp.get("setup")==="1";

/* --- Estado del torneo activo del grupo, resuelto en boot() a partir de la
   llave "torneoId" guardada en la nube. Estas variables se llenan una vez que
   se conoce el torneo, con activarTorneo(). --- */
let FIXTURE=[],FLAG={},ESCUDOS={};
function normalizarEquipo(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
let EQUIPO_CANONICO={}; // nombre normalizado -> nombre canónico (el que usan FLAG/ESCUDOS/el filtro de seguimiento)
function nombreCanonico(n){return EQUIPO_CANONICO[normalizarEquipo(n)]||n;}

async function activarTorneo(id){
  const t=TOURNAMENTS[id]||TOURNAMENTS[TOURNAMENT_DEFAULT];
  FLAG=t.FLAG;
  ESCUDOS=t.ESCUDOS;
  EQUIPO_CANONICO={};
  Object.keys(FLAG).forEach(nombre=>{EQUIPO_CANONICO[normalizarEquipo(nombre)]=nombre;});
  let fixturesRows=[];
  try{
    // fixtures/team_crests son públicas (RLS "using (true)" para lectura) --
    // se leen directo de Postgres, sin pasar por una Edge Function, igual
    // que getFixture antes no exigía PIN.
    const idEnc=encodeURIComponent(id);
    const [fr,er]=await Promise.all([
      restCall(`fixtures?torneo_id=eq.${idEnc}&select=match_id,fase,kickoff,home,away,venue&order=kickoff.asc`),
      restCall(`team_crests?torneo_id=eq.${idEnc}&select=team_name,crest_url`),
    ]);
    fixturesRows=fr||[];
    if(er){
      const remotos={};
      er.forEach(e=>{remotos[e.team_name]=e.crest_url;});
      // Escudos que trae api-football junto al fixture, para equipos sin
      // escudo local curado a mano todavía -- los locales (ESCUDOS de cada
      // torneo en TOURNAMENTS, como los del FPC) siempre ganan si existen.
      ESCUDOS=Object.assign({},remotos,t.ESCUDOS);
    }
  }catch(e){console.error("No se pudo cargar la malla del torneo:",e);}
  // nombreCanonico() absorbe diferencias de tilde/mayúscula entre lo que devuelve
  // la API y nuestros nombres — así el filtro de "seguir equipo" y los escudos
  // funcionan aunque la API escriba el nombre distinto a como lo adivinamos.
  FIXTURE=fixturesRows.map(r=>({id:r.match_id,g:r.fase,home:nombreCanonico(r.home),away:nombreCanonico(r.away),kick:r.kickoff?new Date(r.kickoff).getTime():null,venue:r.venue||"Estadio",custom:false}));
}
// Resultados/en vivo oficiales -- compartidos por torneo (fixture_results),
// ya no duplicados por grupo como en el modelo anterior. Devuelve las dos
// piezas en la misma forma que S.results/S.live ya esperaban.
async function cargarResultadosDelTorneo(torneoId){
  const rows=await restCall(`fixture_results?torneo_id=eq.${encodeURIComponent(torneoId)}&select=match_id,home_score,away_score,status,minute,synced_at`);
  const results={},live={};
  (rows||[]).forEach(row=>{
    if(row.status==null)results[row.match_id]={h:String(row.home_score),a:String(row.away_score)};
    else live[row.match_id]={h:String(row.home_score),a:String(row.away_score),minute:row.minute,syncedAt:row.synced_at};
  });
  return{results,live};
}
function crestHtml(archivo,emoji){
  if(!archivo)return emoji;
  // ESCUDOS puede traer un nombre de archivo local (/escudos/xxx.png, como en
  // FPC) o una URL completa (el logo que manda api-football para los demás
  // torneos) -- se detecta cuál es en vez de asumir siempre archivo local.
  const src=/^https?:\/\//.test(archivo)?archivo:"/escudos/"+archivo;
  return`<img class="crest" src="${src}" alt="" data-fallback="${escapeHtml(emoji)}" onerror="this.outerHTML=this.dataset.fallback">`;
}
function flag(n){return crestHtml(ESCUDOS[n],FLAG[n]||"⚽");}

/* --- Supabase: Edge Functions + lectura directa (fixtures/resultados/
   escudos, públicos vía RLS) -- fetch() plano, sin librería. Ya no queda
   nada del puente a Apps Script (cloudCall/SCRIPT_URL): todo el frontend
   pasa por acá o por localStorage puro (getJSON/setJSON, identidad local
   del dispositivo). */
async function edgeCall(fnName,payload){
  try{
    const r=await fetch(`${FUNCTIONS_URL}/${fnName}`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPABASE_ANON_KEY,"apikey":SUPABASE_ANON_KEY},
      body:JSON.stringify({...payload,tab:TAB}),
    });
    return await r.json();
  }catch(e){console.error("edgeCall error",fnName,e);return null;}
}
async function restCall(pathAndQuery){
  try{
    const r=await fetch(`${REST_URL}/${pathAndQuery}`,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}});
    if(!r.ok)return null;
    return await r.json();
  }catch(e){console.error("restCall error",pathAndQuery,e);return null;}
}

/* --- Storage local (identidad del dispositivo: "me", "organizer") --- Todo
   lo demás ya se guarda en Supabase (ver edgeCall/restCall arriba). */
async function getJSON(k){const v=localStorage.getItem("p:"+k);if(v==null)return null;try{return JSON.parse(v);}catch(e){return null;}}
async function setJSON(k,o){localStorage.setItem("p:"+k,JSON.stringify(o));return true;}

const AVATARS=["⚽","🏆","🦁","🐯","🔥","⭐","🚀","🐉","🌶️","🎯","👑","🐺"];

function allMatches(){
  const cm=S.custom.map(c=>({id:c.id,g:c.g||"Extra",home:c.home,away:c.away,kick:c.kick,venue:c.venue||"Estadio Asignado",custom:true}));
  let all=FIXTURE.map(m=>({...m})).concat(cm);
  for(const m of all){
    const ov=S.teamOverrides[m.id];
    if(ov){
      if(ov.home)m.home=ov.home;
      if(ov.away)m.away=ov.away;
      if(ov.kick)m.kick=ov.kick;      // fecha/hora confirmada por el organizador
      if(ov.venue)m.venue=ov.venue;
    }
  }
  // Modo "equipo": el grupo entero sigue solo a su(s) equipo(s) — se filtra
  // DESPUÉS de aplicar teamOverrides, para que un cambio de nombre en un
  // cruce de eliminación (ej. "Por definir" -> el equipo real) también entre.
  if(S.modoSeguimiento==="equipo"&&S.equiposSeguidos.length){
    all=all.filter(m=>S.equiposSeguidos.includes(m.home)||S.equiposSeguidos.includes(m.away));
  }
  // Los partidos sin fecha (kick===null, "por confirmar") van al final,
  // el resto ordenado normalmente por fecha.
  return all.sort((a,b)=>{
    if(a.kick==null&&b.kick==null)return 0;
    if(a.kick==null)return 1;
    if(b.kick==null)return -1;
    return a.kick-b.kick;
  });
}
function outcome(h,a){h=+h;a=+a;if(h>a)return"1";if(h<a)return"2";return"X";}
function ptsFor(p,r){
  if(!p||!r||p.h==null||p.a==null||r.h==null||r.a==null)return null;
  let s=0;
  if(outcome(p.h,p.a)===outcome(r.h,r.a))s+=1;
  if(+p.h===+r.h&&+p.a===+r.a)s+=2;
  return s;
}
const COLO=m=>false;

/* --- Premios --- */
function fmtCOP(n){return"$"+Math.round(n||0).toLocaleString("es-CO");}
function computePot(){
  const b=S.betting||{};
  const inscripcion=+b.inscripcion||0;
  const jugadores=S.roster.length;
  const total=inscripcion*jugadores;
  const distribuible=total; // peer-to-peer: no hay corte de administración
  const premios=b.premios||{};
  const p1=distribuible*(+premios.p1||0)/100;
  const p2=distribuible*(+premios.p2||0)/100;
  const p3=distribuible*(+premios.p3||0)/100;
  return{inscripcion,jugadores,total,distribuible,p1,p2,p3};
}
const FD=new Intl.DateTimeFormat("es-CO",{weekday:"short",day:"numeric",month:"short"});
const FT=new Intl.DateTimeFormat("es-CO",{hour:"numeric",minute:"2-digit",hour12:true});
function dayKey(ts){return FD.format(ts);}
function whenHtml(kick){return`${cap(FD.format(kick))} · ${FT.format(kick)}`;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function cd(diff){
  if(diff<=0)return null;
  const m=Math.floor(diff/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  if(d>0)return{t:`${d}d ${h}h`,soon:false};
  if(h>0)return{t:`${h}h ${mm}m`,soon:h<2};
  const s=Math.floor((diff%60000)/1000);
  return{t:`${mm}m ${String(s).padStart(2,"0")}s`,soon:true};
}

/* El pronóstico cierra 1 minuto antes del pitazo inicial. Antes cerraba a
   las 11:59 p.m. del día ANTERIOR al partido -- ese margen amplio existía
   porque la fecha/hora del partido no se refrescaba sola (podía quedar
   desactualizada). Ya no aplica: sincronizar-resultados mantiene kickoff
   al día cada 10 min (ver "Torneos y calendario" en CLAUDE.md), así que el
   epoch que llega aquí ya es confiable y no hace falta el colchón. */
function calcularLimite(kickEpoch){
  if(kickEpoch==null)return null;
  return kickEpoch-60*1000;
}

function _hashPin(pin){let h=0;for(let i=0;i<pin.length;i++){h=((h<<5)-h)+pin.charCodeAt(i);h|=0;}return"ph_"+Math.abs(h).toString(36);}
// Solo para el PIN maestro (controla alta/reseteo de TODOS los grupos --
// el credencial de mayor radio de impacto del sistema): hash criptográfico
// real, a diferencia de _hashPin (un checksum de 32 bits, suficiente contra
// fuerza bruta online porque está limitada por rate limiting, pero inútil
// si el hash guardado llegara a filtrarse -- se invierte en segundos). No
// se aplicó lo mismo a PIN de organizador/jugador todavía: requeriría
// migrar en caliente los hashes ya guardados de los grupos activos.
async function _hashMasterPin(pin){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pin));
  return"sha256_"+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

const root=document.getElementById("root");
const elToast=document.getElementById("toast");
let toastTimer;
function toast(msg,warn,dur){elToast.textContent=msg;elToast.className="toast show"+(warn?" warn":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>elToast.className="toast",dur||1900);}

/* Ayudante genérico para cualquier botón que dispare una acción async (guardar,
   crear, confirmar...): lo deshabilita y le pone el balón girando + texto
   mientras trabaja, y lo devuelve a su estado original al terminar — tanto si
   sale bien como si sale mal. Nunca dice "listo" antes de tiempo: solo indica
   que algo está en curso, igual que la animación de guardar pronósticos. */
async function conCargando(btn,fn,texto){
  if(!btn)return await fn();
  const original=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML=`<span class="ball-spin">⚽</span> ${texto||"Un momento..."}`;
  try{
    return await fn();
  }finally{
    if(document.body.contains(btn)){ // el modal pudo haberse cerrado ya (caso de éxito)
      btn.innerHTML=original;
      btn.disabled=false;
    }
  }
}

function tiempoDesde(iso){
  if(!iso)return"";
  const min=Math.max(0,Math.round((S.now-new Date(iso).getTime())/60000));
  if(min<1)return"hace instantes";
  if(min===1)return"hace 1m";
  return`hace ${min}m`;
}
function matchCardHtml(m){

    ?`<div class="box ro">${val!==""?val:"–"}</div>`
    :`<input class="box" id="${side}_${m.id}" type="number" inputmode="numeric" min="0" max="49" placeholder="–" value="${val}">`;

    ?`<span class="cd soon">🔴 ${live.minute!=null?live.minute+"'":"EN VIVO"} · ${tiempoDesde(live.syncedAt)}</span>`
    :sinFecha?"":`<span class="cd" id="cd_${m.id}"></span>`;

    </div>

    <div class="cols"><span class="sp"></span><span class="colh">Pron.</span><span class="colh">Real</span></div>
    <div class="team"><span class="fl">${flag(m.home)}</span><span class="nm ${homeWin?"win":""}">${escapeHtml(m.home)}</span>${predBox("h",ph)}<div class="box real${live?" live":""}">${rh}</div></div>
    <div class="divider"></div>
    <div class="team"><span class="fl">${flag(m.away)}</span><span class="nm ${awayWin?"win":""}">${escapeHtml(m.away)}</span>${predBox("a",pa)}<div class="box real${live?" live":""}">${ra}</div></div>
    <div class="mfoot" id="foot_${m.id}"></div>

function buildDayList(){
  const ms=allMatches().filter(m=>m.kick!=null);
  const map=new Map();
  for(const m of ms){
    const dk=dayKey(m.kick);
    if(!map.has(dk))map.set(dk,{key:dk,label:cap(FD.format(m.kick)),matches:[]});
    map.get(dk).matches.push(m);
  }
  // Orden cronológico garantizado por el propio código, sin depender de que
  // la fuente (fixtures ordenado + partidos personalizados sin ordenar) ya
  // venga en orden -- de eso depende que defaultDay() caiga cerca de "hoy"
  // en vez de saltar a un día cualquiera del calendario en torneos largos.
  return[...map.values()].sort((a,b)=>a.matches[0].kick-b.matches[0].kick);
}
function defaultDay(days){
  if(S.selectedDay&&days.some(d=>d.key===S.selectedDay))return S.selectedDay;
  const now=S.now,todayKey=dayKey(now);
  let d=days.find(d=>d.key===todayKey);
  if(d)return d.key;
  d=days.find(d=>d.matches.some(m=>m.kick>now));
  if(d)return d.key;
  return days.length?days[days.length-1].key:null;
}

function renderPartidos(c){

  const days=buildDayList();
  if(!days.length&&!sinFecha.length){c.innerHTML=`<div class="empty"><span class="big">⚽</span>Aún no hay partidos cargados.</div>`;return;}

  let html="";
  if(sinFecha.length){
    html+=`<div class="daygroup"><div class="dayhead"><span class="d">📋 Por confirmar (${sinFecha.length})</span><span class="rule"></span></div>`;
    for(const m of sinFecha)html+=matchCardHtml(m);
    html+="</div>";
  }

  if(days.length){
    const activeKey=defaultDay(days);
    S.selectedDay=activeKey;
    const activeIdx=days.findIndex(d=>d.key===activeKey);
    const activeDay=days[activeIdx];
    const todayKey=dayKey(S.now);

    let chips="";
    days.forEach((d,i)=>{
      const isToday=d.key===todayKey;
      chips+=`<div class="datechip ${i===activeIdx?"active":""} ${isToday?"hoy":""}" data-idx="${i}">${isToday?"Hoy · "+d.label:d.label}</div>`;
    });

    const dsSlot=document.getElementById("dateselSlot");
    if(dsSlot)dsSlot.innerHTML=`<div class="datesel">
      <button class="dayarrow" id="prevDay" ${activeIdx<=0?"disabled":""}>‹</button>
      <div class="datechips" id="datechips">${chips}</div>
      <button class="dayarrow" id="nextDay" ${activeIdx>=days.length-1?"disabled":""}>›</button>
    </div>`;
    html+=`<div class="daygroup"><div class="dayhead"><span class="d">${activeDay.label}</span><span class="rule"></span></div>`;
    for(const m of activeDay.matches)html+=matchCardHtml(m);
    html+="</div>";
  }

  html+=`<div class="rules"><div><b>Cómo se ganan los puntos</b></div>
    <div style="margin-top:8px"><span class="pill">+1</span> si aciertas quién gana (o el empate).</div>
    <div><span class="pill">+2</span> extra si además clavas el marcador exacto. <span style="color:var(--muted)">(máximo <b style="color:var(--gold)">3</b> por partido)</span></div>
    <div style="margin-top:8px">Cada partido cierra 1 minuto antes del pitazo inicial. Los partidos "por confirmar" quedan abiertos hasta que se confirme su fecha.</div></div>`;
  c.innerHTML=html;

  matchesById={};allMatches().forEach(x=>matchesById[x.id]=x);
  const visibles=sinFecha.concat(days.length?days[days.findIndex(d=>d.key===S.selectedDay)].matches:[]);
  for(const m of visibles){
    const hi=document.getElementById("h_"+m.id),ai=document.getElementById("a_"+m.id);
    matchEls[m.id]={hi,ai,cd:document.getElementById("cd_"+m.id),foot:document.getElementById("foot_"+m.id)};
    const onIn=()=>handleInput(m.id);
    if(hi)hi.oninput=onIn;if(ai)ai.oninput=onIn;
    paintFoot(m);
  }
  const datechipsEl=document.getElementById("datechips");
  if(datechipsEl){
    datechipsEl.querySelectorAll(".datechip").forEach(ch=>{
      ch.onclick=()=>{S.selectedDay=days[+ch.dataset.idx].key;renderView();};
    });
    const activeIdx=days.findIndex(d=>d.key===S.selectedDay);
    const prevBtn=document.getElementById("prevDay"),nextBtn=document.getElementById("nextDay");
    if(prevBtn)prevBtn.onclick=()=>{if(activeIdx>0){S.selectedDay=days[activeIdx-1].key;renderView();}};
    if(nextBtn)nextBtn.onclick=()=>{if(activeIdx<days.length-1){S.selectedDay=days[activeIdx+1].key;renderView();}};
    const activeChip=document.querySelector(".datechip.active");
    if(activeChip)activeChip.scrollIntoView({behavior:"instant",inline:"center",block:"nearest"});
  }
}

function clampVal(v){if(v==="")return"";let n=parseInt(v,10);if(isNaN(n))return"";if(n<0)n=0;if(n>49)n=49;return n;}
function handleInput(id){
  const e=matchEls[id];if(!e)return;
  let h=clampVal(e.hi.value),a=clampVal(e.ai.value);
  if(e.hi.value!==String(h))e.hi.value=h;
  if(e.ai.value!==String(a))e.ai.value=a;
  if(h===""||a==="")delete S.predsMe[id];else S.predsMe[id]={h,a};
  S.dirty.add(id);updateSaveBar();paintFoot(matchesById[id]);
}

function paintFoot(m){
  if(!m)return;
  const e=matchEls[m.id];if(!e||!e.foot)return;
  const locked=m.kick!=null&&S.now>=calcularLimite(m.kick),res=S.results[m.id],p=S.predsMe[m.id];
  const sinGuardar=S.dirty.has(m.id); // escrito pero todavía no confirmado por el servidor
  let left="",right="";
  if(res){
    if(p){const pp=ptsFor(p,res);const cls=pp===3?"p3":(pp===1?"p1":"p0");const txt=pp===3?"¡Marcador exacto!":(pp===1?"Acertaste el ganador":"No acertaste");left=`<span class="status">${txt}</span>`;right=`<span class="pts ${cls}">+${pp} pts</span>`;}
    else{left=`<span class="status">No pronosticaste</span>`;right=`<span class="pts p0">0 pts</span>`;}
  }else if(locked){
    left=`<span class="status locked">🔒 Cerrado</span>`;
    right=p?`<span class="status">Tu pronóstico: <b style="color:var(--line)">${p.h}–${p.a}</b></span>`:`<span class="status">Sin pronóstico</span>`;
  }else{
    left=`<span class="status">Abierto · escribe tu pronóstico</span>`;
    if(p&&sinGuardar){
      right=`<span class="status pending">✏️ ${p.h}–${p.a} escrito · falta guardar</span>`;
    }else if(p){
      right=`<span class="status" style="color:var(--mint);font-weight:700">✓ ${p.h}–${p.a} guardado</span>`;
    }else{
      right=`<span class="status" style="color:var(--flare)">⚠️ sin pronóstico</span>`;
    }
  }
  e.foot.innerHTML=`<span>${left}</span><span>${right}</span>`;
}

function updateSaveBar(){
  const bar=document.getElementById("savebar"),inner=bar.firstElementChild;
  if(S.view==="partidos"&&S.savingPreds){
    inner.innerHTML=`<button class="btn saving" id="saveBtn" disabled><span class="ball-spin">⚽</span><span id="savingLabel">Guardando...</span></button>`;
    bar.style.display="block";
  }else if(S.view==="partidos"&&S.dirty.size>0){
    inner.innerHTML=`<button class="btn" id="saveBtn">Guardar mis pronósticos (${S.dirty.size})</button>`;
    document.getElementById("saveBtn").onclick=savePreds;bar.style.display="block";
  }else bar.style.display="none";
}

async function savePreds(){
  const byId={};allMatches().forEach(m=>byId[m.id]=m);
  let dropped=0;
  for(const id of[...S.dirty]){const m=byId[id];if(m&&m.kick!=null&&S.now>=calcularLimite(m.kick)){dropped++;S.dirty.delete(id);}}
  const cantidadEnEstaAccion=S.dirty.size; // lo que de verdad se está enviando AHORA, no el histórico

  if(cantidadEnEstaAccion===0){
    // Todo lo pendiente se cerró justo antes de guardar — no hay nada real
    // que enviar, así que ni siquiera llamamos al servidor.
    updateSaveBar();allMatches().forEach(m=>paintFoot(m));paintMyStats();paintPendingBanner();
    toast(`❌ ${dropped} partido${dropped===1?"":"s"} ya cerrado${dropped===1?"":"s"} — no se pudo enviar.`,true,5000);
    return;
  }

  // --- Animación honesta: dura exactamente lo que dure la espera real, nunca
  // promete un tiempo ni confirma nada antes de que el servidor responda. ---
  S.savingPreds=true;updateSaveBar();
  const mensajes=["⚽ Guardando...","🥅 Ya casi...","✨ Anotando..."];
  let mi=0;
  const msgInterval=setInterval(()=>{
    mi=(mi+1)%mensajes.length;
    const lbl=document.getElementById("savingLabel");
    if(lbl)lbl.textContent=mensajes[mi];
  },2200);

  // Cada pronóstico es su propia fila en Supabase (a diferencia del blob
  // único de antes), así que se guarda uno por uno en paralelo -- si algún
  // partido falla, el resto igual queda guardado y solo ese sigue "sucio".
  const idsToSave=[...S.dirty];
  const resultados=await Promise.all(idsToSave.map(async id=>{
    const p=S.predsMe[id]||{};
    const r=await edgeCall("guardar-pronostico",{playerId:S.me.id,matchId:id,homeScore:p.h,awayScore:p.a,pin:S.mePinHash});
    return{id,ok:r&&r.status==="success"};
  }));
  const okIds=resultados.filter(x=>x.ok).map(x=>x.id);
  if(okIds.length>0){
    // Solo llamamos a joinRoster si de verdad hace falta (registro nuevo o
    // cambió nombre/avatar) — chequeo local, sin viaje de red, así que no
    // cuesta nada hacerlo siempre, pero evita el segundo POST innecesario.
    const yaEnRoster=S.roster.some(p=>p.id===S.me.id&&p.name===S.me.name&&p.ico===S.me.ico);
    if(!yaEnRoster)await joinRoster();
    S.allPreds[S.me.id]=Object.assign({},S.predsMe);
  }
  for(const id of okIds)S.dirty.delete(id); // solo se limpia lo que el servidor confirmó

  clearInterval(msgInterval);
  S.savingPreds=false;
  updateSaveBar();allMatches().forEach(m=>paintFoot(m));paintMyStats();paintPendingBanner();
  const fallidos=idsToSave.length-okIds.length;
  if(okIds.length===0)toast("❌ No se pudo guardar. Revisa tu conexión y vuelve a intentar.",true,5000);
  else if(fallidos>0)toast(`⚠️ ${okIds.length} guardado${okIds.length===1?"":"s"}, ${fallidos} falló${fallidos===1?"":"aron"}. Intenta de nuevo con el resto.`,true,5500);
  else if(dropped>0)toast(`✅ ${okIds.length} actualizado${okIds.length===1?"":"s"}. ${dropped} ya cerrado${dropped===1?"":"s"}, no se envió.`,false,5500);
  else toast(`✅ ${okIds.length} pronóstico${okIds.length===1?"":"s"} actualizado${okIds.length===1?"":"s"}`,false,4000);
}

/* --- En Vivo --- */
function renderEnVivo(c){
  const now=S.now;
  const DURACION_MAX=3*60*60*1000;
  const activos=allMatches().filter(m=>m.kick<=now && !S.results[m.id] && (now-m.kick)<DURACION_MAX);

  if(!activos.length){
    c.innerHTML=`<div class="empty"><span class="big">⏱️</span>No hay ningún partido en juego en este momento.<br><span style="font-size:12px">Cuando arranque el próximo, vas a ver aquí los pronósticos de todos.</span></div>`;
    return;
  }

  let html="";
  activos.forEach(m=>{
    const live=S.live[m.id];
    const detalle=live?`🔴 ${live.minute!=null?live.minute+"'":"EN VIVO"} · actualizado ${tiempoDesde(live.syncedAt)}`:"🔴 EN JUEGO · esperando marcador";
    html+=`<div class="match" style="padding:14px 14px 12px">
      <div class="mtop">
        <span class="grp">${m.g}</span>
        <span class="when" style="color:var(--flare);font-weight:700">${detalle}</span>
      </div>
      <div class="team"><span class="fl">${flag(m.home)}</span><span class="nm">${escapeHtml(m.home)}</span>${live?`<span style="font-family:var(--score);font-size:22px;color:var(--flare);margin-left:auto">${live.h}</span>`:""}</div>
      <div class="team"><span class="fl">${flag(m.away)}</span><span class="nm">${escapeHtml(m.away)}</span>${live?`<span style="font-family:var(--score);font-size:22px;color:var(--flare);margin-left:auto">${live.a}</span>`:""}</div>
    </div>`;
    const filas=S.roster.map(p=>({p,pr:(S.allPreds[p.id]||{})[m.id]}));
    filas.sort((a,b)=>(b.pr?1:0)-(a.pr?1:0)||a.p.name.localeCompare(b.p.name));
    filas.forEach(({p,pr})=>{
      const mine=S.me&&p.id===S.me.id;
      html+=`<div class="row ${mine?"me":""}">
        <div class="who"><div class="nm"><span class="ico">${p.ico||"⚽"}</span>${escapeHtml(p.name)}${mine?' <span style="color:var(--mint);font-size:11px;font-weight:600">· tú</span>':""}</div></div>
        <div class="score"><div class="pp" style="font-size:22px">${pr?pr.h+"–"+pr.a:"–"}</div><div class="lbl">${pr?"pronóstico":"sin pronóstico"}</div></div>
      </div>`;
    });
  });
  c.innerHTML=html;
}

/* --- Ranking --- */
function buildBoard(){
  const ms=allMatches();
  const finished=ms.filter(m=>S.results[m.id]);
  const board=S.roster.map(pl=>{
    const preds=S.allPreds[pl.id]||{};
    let pts=0,ex=0,ac=0,played=0;
    for(const m of finished){const p=preds[m.id],r=S.results[m.id];if(p){played++;const s=ptsFor(p,r);pts+=s;if(s===3)ex++;if(s>=1)ac++;}}
    return{...pl,pts,ex,ac,played};
  });
  board.sort((a,b)=>b.pts-a.pts||b.ex-a.ex||b.ac-a.ac||a.name.localeCompare(b.name));
  return{board,finished:finished.length,total:ms.length};
}
function renderRanking(c){
  const{board,finished,total}=buildBoard();
  const pot=computePot();
  const premioHtml=pot.total>0?`<div class="rules" style="margin-bottom:14px;border-color:rgba(255,200,69,.35)">
    <div><b>🏆 Bote total: <span style="color:var(--gold)">${fmtCOP(pot.total)}</span></b> <span style="color:var(--muted);font-size:12px">(${pot.jugadores} jugador${pot.jugadores===1?"":"es"} inscrito${pot.jugadores===1?"":"s"})</span></div>
    <div style="margin-top:8px">🥇 <b style="color:var(--gold)">${fmtCOP(pot.p1)}</b> &nbsp; 🥈 <b style="color:var(--line)">${fmtCOP(pot.p2)}</b> &nbsp; 🥉 <b style="color:var(--line)">${fmtCOP(pot.p3)}</b></div>
  </div>`:"";
  if(board.length===0){c.innerHTML=premioHtml+`<div class="empty"><span class="big">🏟️</span>Todavía nadie se ha unido.</div>`;return;}
  let rows="";
  board.forEach((p,i)=>{
    const rank=i+1,mine=S.me&&p.id===S.me.id;
    const topcls=rank===1?"top1":rank===2?"top2":rank===3?"top3":"";
    const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"";
    rows+=`<div class="row ${topcls} ${mine?"me":""}">
      <div class="rank">${rank}</div>
      <div class="who"><div class="nm"><span class="ico">${p.ico||"⚽"}</span>${escapeHtml(p.name)}${mine?' <span style="color:var(--mint);font-size:11px;font-weight:600">· tú</span>':""} ${medal}</div>
      <div class="sub">${p.ex} exacto(s) · ${p.ac} acierto(s) · ${p.played} jugados</div></div>
      <div class="score"><div class="pp">${p.pts}</div><div class="lbl">pts</div></div>
    </div>`;
  });
  c.innerHTML=premioHtml+`<div class="lead"><div class="leadhead"><span class="t">Ranking</span><span class="meta">Resultados: ${finished}/${total}</span></div>${rows}</div>`;
}

  document.body.appendChild(ov);
  const t=TOURNAMENTS[S.torneoId]||TOURNAMENTS[TOURNAMENT_DEFAULT];

  ov.innerHTML=`<div class="card" style="max-height:90vh;overflow-y:auto">

    <h2>Modo de seguimiento</h2>

    <label class="field">
      <input type="radio" name="ms_modo" value="torneo" ${S.modoSeguimiento!=="equipo"?"checked":""}> &nbsp;Seguir el torneo completo

    </label>
    <div id="ms_equipos" style="margin-top:12px;max-height:220px;overflow-y:auto;display:${S.modoSeguimiento==="equipo"?"block":"none"}">
      ${equiposDisponibles.map(eq=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px">
        <input type="checkbox" class="ms_eq" value="${escapeHtml(eq)}" ${seguidosActuales.has(eq)?"checked":""}> <span class="eqcrest">${flag(eq)}</span>${escapeHtml(eq)}
      </label>`).join("")}
    </div>
    <div id="ms_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:8px;text-align:center"></div>
    <button class="btn" id="ms_save" style="margin-top:10px">Guardar</button>
    <button class="btn ghost" id="ms_cancel" style="margin-top:10px">Cancelar</button>
  </div>`;
  document.querySelectorAll('input[name="ms_modo"]').forEach(r=>{
    r.onchange=()=>{document.getElementById("ms_equipos").style.display=r.value==="equipo"&&r.checked?"block":"none";};
  });
  document.getElementById("ms_cancel").onclick=()=>ov.remove();
  document.getElementById("ms_save").onclick=async()=>{
    const err=document.getElementById("ms_err");
    const modo=document.querySelector('input[name="ms_modo"]:checked').value;
    const equipos=[...document.querySelectorAll(".ms_eq:checked")].map(cb=>cb.value);
    if(modo==="equipo"&&!equipos.length){err.textContent="Elige al menos un equipo, o cambia a \"torneo completo\".";return;}
    // Aviso preventivo, no una traba: solo aparece si el organizador de
    // verdad va a cambiar algo (no al reabrir la pantalla sin tocar nada).
    // Este cambio le mueve el piso a TODO el grupo por igual -- avisar antes
    // evita la sensación de "por qué desaparecieron mis partidos" que
    // puede enfriar la buena onda de un grupo.
    const mismoModo=modo===S.modoSeguimiento;
    const mismosEquipos=equipos.length===S.equiposSeguidos.length&&equipos.every(eq=>S.equiposSeguidos.includes(eq));
    if((!mismoModo||!mismosEquipos)&&!confirm("⚠️ Este cambio afecta a TODO el grupo: a partir de ahora todos verán partidos distintos.\n\nPara mantener la buena onda, avísales antes de guardar.\n\n¿Ya les avisaste y quieres continuar?")){
      return;
    }
    await conCargando(document.getElementById("ms_save"),async()=>{
      // Una sola petición autenticada en vez de dos seguidas (modo +
      // equipos por separado): menos superficie para que un hipo transitorio
      // tumbe el guardado, y no puede quedar a medias.
      const r=await edgeCall("guardar-seguimiento",{modoSeguimiento:modo,equiposSeguidos:equipos,pin:S.organizerPinHash});
      if(!r||r.status!=="success"){
        err.textContent=(r&&r.message)||"No se pudo conectar con el servidor. Intenta de nuevo.";
        return;
      }
      S.modoSeguimiento=modo;S.equiposSeguidos=equipos;
      ov.remove();renderShell();renderView();
      toast("Modo de seguimiento actualizado ✓",false,3000);
    },"Guardando...");
  };
}

/* --- Landing informativa (predigoles.com sin ?grupo=) ---
   Reemplaza todo el shell de #root (no es un overlay: no hay nada de app
   debajo que preservar). Mismo copy que la ficha de Gumroad, para que la
   promesa sea consistente entre dónde se compra y dónde se explica. */
// Bandera decorativa por torneo -- solo para la fila de "torneos cubiertos"
// de la landing; si se agrega un torneo nuevo y no está aquí, cae a 🏆 (no
// rompe nada, solo se ve menos vistoso hasta que se agregue).
const LANDING_BANDERAS={fpc_2026_2:"🇨🇴",la_liga_2026_27:"🇪🇸",champions_2026_27:"🏆",liga_mx_2026:"🇲🇽",liga_argentina_2026:"🇦🇷",nations_league_2026_27:"🇪🇺",mls_2026:"🇺🇸",brasileirao_2026:"🇧🇷"};

/* --- Formulario público de solicitud de grupo (predigoles.com/setup) ---
   Cierra el hueco del flujo de venta: Gumroad no permite preguntas
   personalizadas en el checkout, así que el comprador llega aquí desde el
   mensaje del recibo y deja los datos que el administrador central
   necesita para crear su grupo -- sin exponer el PIN maestro, el propio
   Edge Function (solicitar-grupo) valida cada campo. */
function renderSetup(){
  const root=document.getElementById("root");
  // Vuelta del checkout de Wompi (ver crear-pago-wompi, que le agrega
  // "pago=1" a la redirect-url): nunca se vuelve a mostrar el formulario
  // vacío en esta visita -- el webhook ya está procesando el pago por su
  // cuenta, aquí solo se confirma al comprador que se recibió.
  if(new URLSearchParams(location.search).get("pago")==="1"){
    root.innerHTML=`
      <div class="kicker">PREDIGOLES</div>
      <div class="card" style="border-color:var(--mint);max-width:100%;margin-top:20px">
        <div class="kicker" style="color:var(--mint)">Pago recibido ✓</div>
        <h2>¡Gracias por tu compra!</h2>
        <p style="color:var(--muted);font-size:14px">Ya recibimos tu pago. En breve activamos tu grupo y te escribimos con el link y el PIN.</p>
      </div>`;
    return;
  }
  const torneoIds=Object.keys(TOURNAMENTS);
  const torneoOptions=torneoIds.map(id=>`<option value="${id}" ${id===TOURNAMENT_DEFAULT?"selected":""}>${escapeHtml(TOURNAMENTS[id].nombre)}</option>`).join("");
  function listaEquiposHtml(torneoId){
    const conf=TOURNAMENTS[torneoId]||{},flagsT=conf.FLAG||{},escudosT=conf.ESCUDOS||{};
    const equipos=Object.keys(flagsT).sort();
    return equipos.map(eq=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
      <input type="checkbox" class="st_eq" value="${escapeHtml(eq)}"> <span class="eqcrest">${crestHtml(escudosT[eq],flagsT[eq]||"⚽")}</span>${escapeHtml(eq)}
    </label>`).join("");
  }
  root.innerHTML=`
    <div class="kicker">PREDIGOLES</div>
    <h1>Activa <span class="yr">tu quiniela</span></h1>
    <p class="sub">Cuéntanos cómo quieres tu grupo para activarlo.</p>
    <div class="card" style="max-width:100%;margin-top:20px">
      <label class="field">ID del grupo (para el link — solo letras, números, guiones)</label>
      <input class="input" id="st_id" maxlength="40" placeholder="ej: mioficina2026">
      <label class="field" style="margin-top:12px">Nombre del grupo</label>
      <input class="input" id="st_nombre" maxlength="60" placeholder="Ej: Quiniela Oficina">
      <label class="field" style="margin-top:12px">Torneo</label>
      <select class="select-popup" id="st_torneo">${torneoOptions}</select>
      <label class="field">¿Qué va a seguir este grupo?</label>
      <label class="field" style="font-weight:400">
        <input type="radio" name="st_modo" value="torneo" checked> &nbsp;El torneo completo
      </label><br>
      <label class="field" style="font-weight:400;margin-top:6px">
        <input type="radio" name="st_modo" value="equipo"> &nbsp;Solo uno o varios equipos
      </label>
      <div id="st_equipos" style="margin-top:10px;max-height:180px;overflow-y:auto;display:none">${listaEquiposHtml(TOURNAMENT_DEFAULT)}</div>
      <label class="field" style="margin-top:14px">Tu nombre (administrador del grupo)</label>
      <input class="input" id="st_admin_nombre" maxlength="60" placeholder="Nombre de contacto">
      <label class="field" style="margin-top:10px">Tu celular</label>
      <input class="input" id="st_admin_cel" maxlength="20" placeholder="Ej: 3001234567">
      <label class="field" style="margin-top:10px">Tu correo</label>
      <input class="input" id="st_admin_correo" type="email" maxlength="60" placeholder="correo@ejemplo.com">
      <label class="field" style="margin-top:10px">PIN que quieres usar (opcional — si lo dejas vacío, te asignamos uno)</label>
      <input class="input" id="st_pin" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:20px;text-align:center">
      <div id="st_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:8px;text-align:center"></div>
      <button class="btn" id="st_enviar" style="margin-top:10px">Enviar solicitud</button>
    </div>
  `;
  document.getElementById("st_torneo").onchange=(e)=>{
    document.getElementById("st_equipos").innerHTML=listaEquiposHtml(e.target.value);
  };
  document.querySelectorAll('input[name="st_modo"]').forEach(r=>{
    r.onchange=()=>{document.getElementById("st_equipos").style.display=r.value==="equipo"&&r.checked?"block":"none";};
  });
  document.getElementById("st_enviar").onclick=async()=>{
    const err=document.getElementById("st_err");
    const grupoId=document.getElementById("st_id").value.trim();
    const nombreGrupo=document.getElementById("st_nombre").value.trim();
    const torneoId=document.getElementById("st_torneo").value;
    const modoSeguimiento=document.querySelector('input[name="st_modo"]:checked').value;
    const equiposSeguidos=[...document.querySelectorAll(".st_eq:checked")].map(cb=>cb.value);
    const nombreAdmin=document.getElementById("st_admin_nombre").value.trim();
    const celularAdmin=document.getElementById("st_admin_cel").value.trim();
    const correoAdmin=document.getElementById("st_admin_correo").value.trim();
    const pinDeseado=document.getElementById("st_pin").value.trim();
    if(!grupoId||!/^[a-zA-Z0-9_-]{1,40}$/.test(grupoId)){err.textContent="ID de grupo inválido (solo letras, números, guiones).";return;}
    if(!nombreGrupo){err.textContent="Falta el nombre del grupo.";return;}
    if(modoSeguimiento==="equipo"&&!equiposSeguidos.length){err.textContent="Elige al menos un equipo, o marca \"el torneo completo\".";return;}
    if(!nombreAdmin){err.textContent="Falta tu nombre.";return;}
    if(!celularAdmin){err.textContent="Falta tu celular.";return;}
    if(!correoAdmin.includes("@")){err.textContent="Correo inválido.";return;}
    if(pinDeseado&&!/^\d{4}$/.test(pinDeseado)){err.textContent="El PIN debe ser de 4 dígitos, o déjalo vacío.";return;}
    await conCargando(document.getElementById("st_enviar"),async()=>{
      const r=await edgeCall("solicitar-grupo",{grupoId,nombreGrupo,torneoId,modoSeguimiento,equiposSeguidos,nombreAdmin,celularAdmin,correoAdmin,pinDeseado});
      if(!r||r.status!=="success"){
        err.textContent=(r&&r.message)||"No se pudo enviar. Intenta de nuevo.";
        return;
      }
      // Si Wompi ya está configurado, pagar es el siguiente paso: se redirige
      // al Checkout Web de Wompi con una firma calculada en el servidor (ver
      // crear-pago-wompi). Si todavía no está configurado (pasarela en
      // proceso de activación), sigue funcionando como hoy -- sin romper el
      // flujo mientras tanto.
      const pago=await edgeCall("crear-pago-wompi",{solicitudId:r.solicitudId});
      if(pago&&pago.status==="success"){
        const params=new URLSearchParams({
          "public-key":pago.publicKey,
          "currency":pago.currency,
          "amount-in-cents":String(pago.amountInCents),
          "reference":pago.reference,
          "signature:integrity":pago.signature,
          "redirect-url":pago.redirectUrl,
          "customer-data:email":correoAdmin,
          "customer-data:full-name":nombreAdmin,
          "customer-data:phone-number":celularAdmin,
        });
        location.href=pago.checkoutUrl+"?"+params.toString();
        return;
      }
      root.innerHTML=`<div class="card" style="border-color:var(--mint);max-width:100%;margin-top:20px">
        <div class="kicker" style="color:var(--mint)">Solicitud enviada ✓</div>
        <h2>¡Listo, ${escapeHtml(nombreAdmin)}!</h2>
        <p style="color:var(--muted);font-size:14px">En breve activamos tu grupo y te escribimos a <b style="color:var(--line)">${escapeHtml(correoAdmin)}</b> o <b style="color:var(--line)">${escapeHtml(celularAdmin)}</b> con el link y el PIN.</p>
      </div>`;
    },"Enviando...");
  };
}

// Heurística de país por zona horaria del navegador -- ninguna liga ata a
// Champions/Nations League a un solo país, así que esas quedan fuera del
// mapa y solo entran por el fallback global (el próximo partido de
// cualquier torneo, sin importar el país).
function torneoPorZonaHoraria(){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
  if(tz==="America/Bogota")return"fpc_2026_2";
  if(tz==="Europe/Madrid")return"la_liga_2026_27";
  if(tz.startsWith("America/Argentina"))return"liga_argentina_2026";
  if(tz.startsWith("America/")&&/Mexico_City|Cancun|Merida|Monterrey|Tijuana|Chihuahua|Hermosillo|Matamoros|Bahia_Banderas/.test(tz))return"liga_mx_2026";
  return null;
}

    // S.allPreds ya viene completo desde estado-grupo (boot) -- no hace
    // falta un fetch aparte por jugador como antes.
    S.predsMe=S.allPreds[player.id]||{};
    await joinRoster();
    ov.remove();renderShell();renderView();

    const player=roster.find(p=>p.id===S.me.id);
    if(player){renderPinScreen(player);return;}
  }

async function joinRoster(){
  const r=await edgeCall("join-grupo",{player:S.me});
  if(r&&r.status==="success"&&r.roster){
    S.roster=r.roster;
  } else if(!(r&&r.status==="name_taken")&&!S.roster.some(p=>p.id===S.me.id)){
    S.roster.push(S.me);
  }
  return r;
}

/* --- Tick --- */
function tick(){
  if(ES_PANEL_CENTRAL)return;
  S.now=Date.now();
  if(S.view!=="partidos")return;
  for(const m of allMatches()){
    const e=matchEls[m.id];if(!e)continue;
    if(m.kick==null){
      if(e.hi&&e.hi.disabled){e.hi.disabled=false;e.ai.disabled=false;paintFoot(m);}
      continue;
    }
    const limite=calcularLimite(m.kick);
    const diff=limite-S.now,info=cd(diff);
    if(e.cd){if(info){e.cd.textContent="Cierra en "+info.t;e.cd.className="cd"+(info.soon?" soon":"");}else{e.cd.textContent="Cerrado";e.cd.className="cd closed";}}
    const locked=S.now>=limite;
    if(e.hi&&e.hi.disabled!==locked){e.hi.disabled=locked;e.ai.disabled=locked;paintFoot(m);}
  }
}
setInterval(tick,1000);

/* --- Sync --- */
async function refreshShared(){
  if(ES_PANEL_CENTRAL)return;
  try{
    const r=await edgeCall("estado-grupo",{});
    if(!r||r.status!=="success"||!r.group)return;

    const roster=r.roster||S.roster;
    const custom=(r.customMatches||[]).map(c=>({id:c.id,g:c.fase||"Extra",home:c.home,away:c.away,kick:c.kickoff?new Date(c.kickoff).getTime():null,venue:c.venue||"Estadio Asignado"}));
    S.roster=roster;S.custom=custom;
    S.betting=r.group.betting||S.betting;
    S.teamOverrides=r.group.teamOverrides||S.teamOverrides;
    S.modoSeguimiento=r.group.modoSeguimiento||S.modoSeguimiento;
    S.equiposSeguidos=r.group.equiposSeguidos||S.equiposSeguidos;

    const{results:resultsOficiales,live}=await cargarResultadosDelTorneo(S.torneoId);
    const resultsPersonalizados={};
    (r.customMatches||[]).forEach(c=>{
      if(c.homeScore!=null&&c.awayScore!=null)resultsPersonalizados[c.id]={h:String(c.homeScore),a:String(c.awayScore)};
    });
    const results=Object.assign({},resultsOficiales,resultsPersonalizados);
    S.live=live;
    const resChanged=JSON.stringify(results)!==JSON.stringify(S.results);
    S.results=results;

    const preds={};
    for(const pid in(r.predictions||{})){
      const p={};
      for(const mid in r.predictions[pid]){
        const pr=r.predictions[pid][mid];
        p[mid]={h:pr.h!=null?String(pr.h):null,a:pr.a!=null?String(pr.a):null};
      }
      preds[pid]=p;
    }
    S.allPreds=preds;
    if(S.me){
      const fresh=S.allPreds[S.me.id]||{};
      for(const id of S.dirty)if(S.predsMe[id]!=null)fresh[id]=S.predsMe[id];
      const changed=JSON.stringify(fresh)!==JSON.stringify(S.predsMe);
      S.predsMe=fresh;S.allPreds[S.me.id]=Object.assign({},S.predsMe);
      if(S.view==="ranking")renderRanking(document.getElementById("content"));
      else if(S.view==="envivo")renderEnVivo(document.getElementById("content"));
      else if(S.view==="partidos"&&(resChanged||changed)&&S.dirty.size===0)renderPartidos(document.getElementById("content"));
      else if(S.view==="partidos"&&resChanged)allMatches().forEach(m=>paintFoot(m));
    }else{
      if(S.view==="ranking")renderRanking(document.getElementById("content"));
      else if(S.view==="envivo")renderEnVivo(document.getElementById("content"));
      else if(S.view==="partidos"&&resChanged)allMatches().forEach(m=>paintFoot(m));
    }
    paintMyStats();paintPendingBanner();
  }catch(e){console.error(e);}
}
setInterval(refreshShared,25000);

        <div style="font-weight:700;color:var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${escapeHtml(s.nombreGrupo)} <span style="color:var(--muted);font-weight:400">(${escapeHtml(s.grupoId)})</span>
          ${s.estadoPago==="pagado"?'<span style="font-size:11px;font-weight:700;color:var(--mint);background:rgba(54,224,191,.12);border:1px solid rgba(54,224,191,.4);border-radius:999px;padding:2px 8px">✓ PAGADO</span>':'<span style="font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--faint);border-radius:999px;padding:2px 8px">SIN PAGAR</span>'}
        </div>
        <div style="color:var(--muted);font-size:12.5px;margin-top:4px">
          Torneo: ${escapeHtml((TOURNAMENTS[s.torneoId]||{}).nombre||s.torneoId)} ·
          ${s.modoSeguimiento==="equipo"?"Equipos: "+escapeHtml((s.equiposSeguidos||[]).join(", ")):"Todo el torneo"}<br>
          Admin: ${escapeHtml(s.nombreAdmin)} · ${escapeHtml(s.celularAdmin)} · ${escapeHtml(s.correoAdmin)}<br>
          PIN deseado: ${s.pinDeseado?escapeHtml(s.pinDeseado):"(sin preferencia)"} · Pedido: ${fmtFechaCorta(s.fechaSolicitud)}
        </div>
        <div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">
          <button class="link-btn pc-solicitud-crear" data-id="${escapeHtml(s.id)}" style="color:var(--gold)">➕ Crear grupo con estos datos</button>
          <button class="link-btn pc-solicitud-pago" data-id="${escapeHtml(s.id)}" data-nuevo-estado="${s.estadoPago==="pagado"?"pendiente":"pagado"}" style="color:var(--muted)">${s.estadoPago==="pagado"?"↺ Marcar sin pagar":"💰 Marcar como pagada"}</button>
          <button class="link-btn pc-solicitud-ok" data-id="${escapeHtml(s.id)}" style="color:var(--mint)">✓ Marcar como atendida</button>
        </div>
      </div>`).join("")}
    </div>
  `:"";

  // Comentarios del botón flotante -- mismo trato que solicitudes: solo se
  // muestra si hay algo nuevo, y "Marcar como leído" lo saca de la lista.
  const origenLabel={landing:"🌐 Home",jugador:"⚽ Jugador",organizador:"🔑 Organizador"};
  const comentariosHtml=PC_comentarios.length?`
    <div class="kicker" style="color:var(--mint);margin:22px 0 8px">Comentarios nuevos (${PC_comentarios.length})</div>
    <div class="rules" style="border-color:rgba(87,230,150,.35);padding:0;overflow:hidden">
      ${PC_comentarios.map((c,i)=>`
      <div style="padding:14px${i?';border-top:1px solid var(--faint)':""}">
        <div style="color:var(--muted);font-size:12px">
          ${origenLabel[c.origen]||c.origen}${c.grupoId?" · grupo: "+escapeHtml(c.grupoId):""}${c.autorNombre?" · "+escapeHtml(c.autorNombre):""} · ${fmtFechaCorta(c.fecha)}
        </div>
        <div style="color:var(--line);font-size:14px;margin-top:4px;white-space:pre-wrap">${escapeHtml(c.mensaje)}</div>
        <button class="link-btn pc-comentario-ok" data-id="${escapeHtml(c.id)}" style="color:var(--mint);margin-top:8px">✓ Marcar como leído</button>
      </div>`).join("")}
    </div>
  `:"";

  pcCard(`
    <div class="kicker" style="color:var(--mint);margin-bottom:2px">PREDIGOLES</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h1 style="font-family:var(--display);font-size:28px;margin:0;text-transform:uppercase">Panel Central</h1>
      <button class="link-btn" id="pc_salir">salir</button>
    </div>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:16px">${PC_grupos.length} grupo${PC_grupos.length===1?"":"s"} registrado${PC_grupos.length===1?"":"s"}</div>
    ${solicitudesHtml}
    ${comentariosHtml}
    <button class="btn" id="pc_nuevo" style="margin-top:18px;margin-bottom:18px">➕ Crear grupo nuevo</button>
    ${filas}
  `);
  document.getElementById("pc_salir").onclick=()=>{PC_masterHash=null;bootPanelCentral();};
  document.getElementById("pc_nuevo").onclick=showCrearGrupo;
  document.querySelectorAll(".pc-comentario-ok").forEach(btn=>{
    btn.onclick=async()=>{
      await conCargando(btn,async()=>{
        const r=await edgeCall("admin-marcar-comentario-leido",{masterPin:PC_masterHash,comentarioId:btn.dataset.id});
        if(r&&r.status==="success"){
          PC_comentarios=PC_comentarios.filter(c=>c.id!==btn.dataset.id);
          renderPanelCentralMain();
        }else{
          toast((r&&r.message)||"No se pudo actualizar.",true,3000);
        }
      },"...");
    };
  });
  document.querySelectorAll(".pc-solicitud-crear").forEach(btn=>{
    btn.onclick=async()=>{
      const s=PC_solicitudes.find(x=>x.id===btn.dataset.id);
      if(!s)return;
      await conCargando(btn,async()=>{
        const r=await edgeCall("admin-provisionar-grupo",{
          masterPin:PC_masterHash,grupoId:s.grupoId,nombreGrupo:s.nombreGrupo,torneoId:s.torneoId,
          modoSeguimiento:s.modoSeguimiento,equiposSeguidos:s.equiposSeguidos||[],
          nombreAdmin:s.nombreAdmin,celularAdmin:s.celularAdmin,correoAdmin:s.correoAdmin,pin:s.pinDeseado||"",
        });
        if(r&&r.status==="success"){
          // La solicitud ya cumplió su propósito -- se marca atendida sola,
          // sin que el admin tenga que dar un segundo clic aparte.
          await edgeCall("admin-marcar-solicitud-atendida",{masterPin:PC_masterHash,solicitudId:s.id});
          PC_solicitudes=PC_solicitudes.filter(x=>x.id!==s.id);
          mostrarGrupoCreado(r.grupoId,r.pin,s.nombreGrupo,s.correoAdmin,s.nombreAdmin);
        }else{
          toast((r&&r.message)||"No se pudo crear el grupo.",true,4000);
        }
      },"Creando...");
    };
  });
  document.querySelectorAll(".pc-solicitud-pago").forEach(btn=>{
    btn.onclick=async()=>{
      await conCargando(btn,async()=>{
        const nuevoEstado=btn.dataset.nuevoEstado;
        const r=await edgeCall("admin-marcar-solicitud-pagada",{masterPin:PC_masterHash,solicitudId:btn.dataset.id,estadoPago:nuevoEstado});
        if(r&&r.status==="success"){
          const s=PC_solicitudes.find(x=>x.id===btn.dataset.id);
          if(s)s.estadoPago=nuevoEstado;
          renderPanelCentralMain();
        }else{
          toast((r&&r.message)||"No se pudo actualizar.",true,3000);
        }
      },"...");
    };
  });
  document.querySelectorAll(".pc-solicitud-ok").forEach(btn=>{
    btn.onclick=async()=>{
      await conCargando(btn,async()=>{
        const r=await edgeCall("admin-marcar-solicitud-atendida",{masterPin:PC_masterHash,solicitudId:btn.dataset.id});
        if(r&&r.status==="success"){
          PC_solicitudes=PC_solicitudes.filter(s=>s.id!==btn.dataset.id);
          renderPanelCentralMain();
        }else{
          toast((r&&r.message)||"No se pudo actualizar.",true,3000);
        }
      },"...");
    };
  });
  document.querySelectorAll(".pc-reset").forEach(btn=>{
    btn.onclick=async()=>{
      if(!confirm(`¿Resetear el PIN de "${btn.dataset.nombre}"? El PIN anterior deja de funcionar de inmediato.`))return;
      await conCargando(btn,async()=>{
        const r=await edgeCall("admin-resetear-pin",{masterPin:PC_masterHash,grupoId:btn.dataset.id});
        if(r&&r.status==="success"){
          // admin-resetear-pin no devuelve correo/nombre del admin -- se
          // buscan en la lista ya cargada de grupos (PC_grupos), que sí los
          // trae (ver admin-listar-grupos).
          const g=PC_grupos.find(x=>x.grupoId===r.grupoId);
          mostrarGrupoCreado(r.grupoId,r.pin,btn.dataset.nombre,g&&g.correoAdmin,g&&g.nombreAdmin);
        }else{
          toast((r&&r.message)||"No se pudo resetear.",true,4000);
        }
      },"Reseteando...");
    };
  });
  document.querySelectorAll(".pc-estado").forEach(sel=>{
    sel.onchange=async()=>{
      sel.disabled=true; // un <select> no puede mostrar el balón girando sin romper sus opciones — solo se deshabilita mientras trabaja
      const r=await edgeCall("admin-actualizar-pago",{masterPin:PC_masterHash,grupoId:sel.dataset.id,estadoPago:sel.value});
      sel.disabled=false;
      if(r&&r.status==="success")toast("Estado de pago actualizado ✓",false,2500);
      else toast("No se pudo actualizar.",true,3000);
    };
  });
}

function showCrearGrupo(){
  const old=document.getElementById("ovl");if(old)old.remove();
  const ov=document.createElement("div");ov.className="overlay";ov.id="ovl";
  document.body.appendChild(ov);
  const torneoIds=Object.keys(TOURNAMENTS);
  const torneoOptions=torneoIds.map(id=>`<option value="${id}" ${id===TOURNAMENT_DEFAULT?"selected":""}>${escapeHtml(TOURNAMENTS[id].nombre)}</option>`).join("");
  function listaEquiposHtml(torneoId){
    const conf=TOURNAMENTS[torneoId]||{},flagsT=conf.FLAG||{},escudosT=conf.ESCUDOS||{};
    const equipos=Object.keys(flagsT).sort();
    return equipos.map(eq=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
      <input type="checkbox" class="cg_eq" value="${escapeHtml(eq)}"> <span class="eqcrest">${crestHtml(escudosT[eq],flagsT[eq]||"⚽")}</span>${escapeHtml(eq)}
    </label>`).join("");
  }
  ov.innerHTML=`<div class="card" style="max-height:90vh;overflow-y:auto">
    <div class="kicker" style="color:var(--gold)">Panel Central</div>
    <h2>Crear grupo</h2>
    <label class="field">ID del grupo (para el link — solo letras, números, guiones)</label>
    <input class="input" id="cg_id" maxlength="40" placeholder="ej: cliente-oficina1">
    <label class="field" style="margin-top:12px">Nombre del grupo</label>
    <input class="input" id="cg_nombre" maxlength="30" placeholder="Ej: Polla Oficina Cliente X">
    <label class="field" style="margin-top:12px">Torneo</label>
    <select class="select-popup" id="cg_torneo">${torneoOptions}</select>
    <label class="field">¿Qué va a seguir este grupo?</label>
    <label class="field" style="font-weight:400">
      <input type="radio" name="cg_modo" value="torneo" checked> &nbsp;El torneo completo
    </label><br>
    <label class="field" style="font-weight:400;margin-top:6px">
      <input type="radio" name="cg_modo" value="equipo"> &nbsp;Solo uno o varios equipos
    </label>
    <div id="cg_equipos" style="margin-top:10px;max-height:180px;overflow-y:auto;display:none">${listaEquiposHtml(TOURNAMENT_DEFAULT)}</div>
    <label class="field" style="margin-top:14px">Nombre del administrador del grupo</label>
    <input class="input" id="cg_admin_nombre" maxlength="60" placeholder="Nombre de contacto">
    <label class="field" style="margin-top:10px">Celular del administrador</label>
    <input class="input" id="cg_admin_cel" maxlength="20" placeholder="Ej: 3001234567">
    <label class="field" style="margin-top:10px">Correo del administrador</label>
    <input class="input" id="cg_admin_correo" type="email" maxlength="60" placeholder="correo@ejemplo.com">
    <label class="field" style="margin-top:10px">PIN de administrador (déjalo vacío para generar uno al azar)</label>
    <input class="input" id="cg_pin" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:20px;text-align:center">
    <div id="cg_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:8px;text-align:center"></div>
    <button class="btn" id="cg_crear" style="margin-top:10px">Crear</button>
    <button class="btn ghost" id="cg_cancelar" style="margin-top:10px">Cancelar</button>
  </div>`;
  document.getElementById("cg_torneo").onchange=(e)=>{
    document.getElementById("cg_equipos").innerHTML=listaEquiposHtml(e.target.value);
  };
  document.querySelectorAll('input[name="cg_modo"]').forEach(r=>{
    r.onchange=()=>{document.getElementById("cg_equipos").style.display=r.value==="equipo"&&r.checked?"block":"none";};
  });
  document.getElementById("cg_cancelar").onclick=()=>ov.remove();
  document.getElementById("cg_crear").onclick=async()=>{
    const err=document.getElementById("cg_err");
    const grupoId=document.getElementById("cg_id").value.trim();
    const nombreGrupo=document.getElementById("cg_nombre").value.trim();
    const torneoId=document.getElementById("cg_torneo").value;
    const modoSeguimiento=document.querySelector('input[name="cg_modo"]:checked').value;
    const equiposSeguidos=[...document.querySelectorAll(".cg_eq:checked")].map(cb=>cb.value);
    const nombreAdmin=document.getElementById("cg_admin_nombre").value.trim();
    const celularAdmin=document.getElementById("cg_admin_cel").value.trim();
    const correoAdmin=document.getElementById("cg_admin_correo").value.trim();
    const pin=document.getElementById("cg_pin").value.trim();
    if(!grupoId||!/^[a-zA-Z0-9_-]{1,40}$/.test(grupoId)){err.textContent="ID de grupo inválido (solo letras, números, guiones).";return;}
    if(!nombreGrupo){err.textContent="Falta el nombre del grupo.";return;}
    if(modoSeguimiento==="equipo"&&!equiposSeguidos.length){err.textContent="Elige al menos un equipo, o marca \"el torneo completo\".";return;}
    if(pin&&!/^\d{4}$/.test(pin)){err.textContent="El PIN debe ser de 4 dígitos, o déjalo vacío.";return;}
    await conCargando(document.getElementById("cg_crear"),async()=>{
      const r=await edgeCall("admin-provisionar-grupo",{masterPin:PC_masterHash,grupoId,nombreGrupo,torneoId,modoSeguimiento,equiposSeguidos,nombreAdmin,celularAdmin,correoAdmin,pin});
      if(r&&r.status==="success"){
        ov.remove();
        mostrarGrupoCreado(r.grupoId,r.pin,nombreGrupo,correoAdmin,nombreAdmin);
      }else{
        err.textContent=(r&&r.message)||"No se pudo crear el grupo.";
      }
    },"Creando...");
  };
}

function mostrarGrupoCreado(grupoId,pin,nombreGrupo,correoAdmin,nombreAdmin){
  const old=document.getElementById("ovl");if(old)old.remove();
  const ov=document.createElement("div");ov.className="overlay";ov.id="ovl";
  document.body.appendChild(ov);
  const link=`${location.origin}/?grupo=${grupoId}`;
  // El botón de notificar por correo solo tiene sentido si sabemos a quién
  // escribirle -- grupos viejos creados antes de pedir correo obligatorio
  // pueden no tenerlo, así que se oculta en vez de fallar en silencio.
  const botonCorreoHtml=correoAdmin?`<button class="btn ghost" id="gc_correo" style="margin-top:10px">✉️ Notificar al admin por correo</button>`:"";
  ov.innerHTML=`<div class="card" style="border-color:var(--mint)">
    <div class="kicker" style="color:var(--mint)">Grupo creado ✓</div>
    <h2>${escapeHtml(nombreGrupo)}</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 14px">Copia esto y mándaselo al administrador del grupo — es la única vez que se muestra el PIN en texto plano.</p>
    <label class="field">Link</label>
    <input class="input" id="gc_link" readonly value="${escapeHtml(link)}">
    <label class="field" style="margin-top:10px">PIN de administrador</label>
    <input class="input" id="gc_pin" readonly value="${escapeHtml(pin)}" style="letter-spacing:.3em;font-size:22px;text-align:center;color:var(--gold)">
    <button class="btn" id="gc_copiar" style="margin-top:14px">📋 Copiar link + PIN</button>
    ${botonCorreoHtml}
    <button class="btn ghost" id="gc_cerrar" style="margin-top:10px">Cerrar</button>
  </div>`;
  document.getElementById("gc_copiar").onclick=()=>{
    navigator.clipboard.writeText(`Link: ${link}\nPIN de administrador: ${pin}`);
    toast("Copiado ✓",false,2000);
  };
  const btnCorreo=document.getElementById("gc_correo");
  if(btnCorreo)btnCorreo.onclick=async()=>{
    await conCargando(btnCorreo,async()=>{
      const r=await edgeCall("notificar-admin-grupo",{masterPin:PC_masterHash,grupoId,nombreGrupo,nombreAdmin,correoAdmin,pin});
      if(r&&r.status==="success")toast("Correo enviado ✓",false,2500);
      else toast((r&&r.message)||"No se pudo enviar el correo.",true,4000);
    },"Enviando...");
  };
  document.getElementById("gc_cerrar").onclick=async()=>{
    ov.remove();
    const r=await edgeCall("admin-listar-grupos",{masterPin:PC_masterHash});
    if(r&&r.status==="success"){PC_grupos=r.grupos||[];renderPanelCentralMain();}
  };
}

/* --- Boot --- */
(async function boot(){
  if(ES_PANEL_CENTRAL){ bootPanelCentral(); return; }
  if(ES_SETUP){ renderSetup(); return; }
  initFeedbackButton();
  if(ES_LANDING){ renderLanding(); return; }
  try{
    S.allPreds={};
    S.me=await getJSON("me");
    S.mePinHash=S.me?localStorage.getItem("pg_pinp_"+TAB+"_"+S.me.id):null;
    S.organizer=(await getJSON("organizer"))||false;
    S.organizerPinHash=S.organizer?localStorage.getItem("pg_pinhash_"+TAB):null;

    // estado-grupo trae en una sola llamada todo lo específico de este
    // grupo (antes eran ~10 getJSON(...,true) leyendo de una CACHE
    // poblada por fetchAllShared/getAll) -- ver Code.gs → Supabase,
    // subtarea 09a.
    const r=await edgeCall("estado-grupo",{});
    if(!r||r.status!=="success"){ showErrorConexion(); return; }
    if(!r.group){ showGrupoNoEncontrado(); return; }

    S.groupName=r.group.name;
    S.torneoId=r.group.torneoId||TOURNAMENT_DEFAULT;
    S.modoSeguimiento=r.group.modoSeguimiento||"torneo";
    S.equiposSeguidos=r.group.equiposSeguidos||[];
    S.betting=r.group.betting||{inscripcion:0,premios:{p1:0,p2:0,p3:0}};
    S.teamOverrides=r.group.teamOverrides||{};
    S.roster=r.roster||[];
    S.custom=(r.customMatches||[]).map(c=>({id:c.id,g:c.fase||"Extra",home:c.home,away:c.away,kick:c.kickoff?new Date(c.kickoff).getTime():null,venue:c.venue||"Estadio Asignado"}));

    await activarTorneo(S.torneoId);

    // Resultados oficiales (compartidos por torneo) + resultados de
    // partidos personalizados (ya vienen embebidos en customMatches,
    // porque esos sí son propios de este grupo) -- se combinan en un
    // solo S.results, misma forma que antes para no tocar el resto del
    // código de renderizado/puntajes.
    const{results:resultsOficiales,live:liveOficial}=await cargarResultadosDelTorneo(S.torneoId);
    const resultsPersonalizados={};
    (r.customMatches||[]).forEach(c=>{
      if(c.homeScore!=null&&c.awayScore!=null)resultsPersonalizados[c.id]={h:String(c.homeScore),a:String(c.awayScore)};
    });
    S.results=Object.assign({},resultsOficiales,resultsPersonalizados);
    S.live=liveOficial;

    // predictions ya viene con TODOS los jugadores del grupo en una sola
    // respuesta -- antes hacía falta un getJSON("preds_"+id,true) por
    // cada jugador del roster.
    S.allPreds={};
    for(const pid in(r.predictions||{})){
      const preds={};
      for(const mid in r.predictions[pid]){
        const p=r.predictions[pid][mid];
        preds[mid]={h:p.h!=null?String(p.h):null,a:p.a!=null?String(p.a):null};
      }
      S.allPreds[pid]=preds;
    }
    if(S.me){
      S.predsMe=S.allPreds[S.me.id]||{};
      const yaEnRoster=S.roster.some(p=>p.id===S.me.id&&p.name===S.me.name&&p.ico===S.me.ico);
      if(!yaEnRoster)await joinRoster();
    }

    renderShell();renderView();
    if(!S.me)showOnboarding(false);
    // Sesiones que quedaron activas antes de este cambio de seguridad tienen
    // "me" guardado pero nunca guardaron el hash del PIN localmente (no
    // existía esa clave) — se les pide reconfirmar su PIN una sola vez; el
    // servidor ya lo tiene guardado, así que solo valida y lo cachea.
    else if(!S.mePinHash)showOnboarding(true);
  }catch(e){console.error("Boot error:",e);renderShell();renderView();}
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Predigoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0a1c15; --panel:#0f2a20; --panel2:#123524; --raise:#16402e;
    --line:#eaf3ec; --muted:#83a294; --faint:rgba(234,243,236,.10);
    --gold:#ffc845; --gold2:#d99a1f; --flare:#ff4d6d; --mint:#36e0bf;
    --display:'Anton',sans-serif; --score:'Teko',sans-serif; --body:'Inter',system-ui,sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--body);color:var(--line);background:var(--pitch);
    background-image:radial-gradient(120% 60% at 50% -10%,rgba(54,224,191,.08),transparent 60%),
    repeating-linear-gradient(180deg,transparent 0 46px,rgba(255,255,255,.012) 46px 92px);
    -webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}
  a{color:var(--mint)}
  header{padding:22px 2px 12px;position:relative}
  .topfijo{position:sticky;top:0;z-index:30;background:var(--pitch);padding-bottom:4px}
  .kicker{font:600 11px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--mint)}
  h1{font-family:var(--display);font-weight:400;margin:6px 0 2px;font-size:clamp(34px,9vw,52px);line-height:.92;letter-spacing:.5px;text-transform:uppercase}
  h1 .yr{color:var(--gold);-webkit-text-stroke:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .notaeq{display:inline-flex;align-items:center;gap:4px}
  .notaeq .crest{width:16px;height:16px;object-fit:contain;border-radius:3px}
  .whoami{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--faint);border-radius:999px;padding:7px 12px;font-size:13px}
  .chip b{font-weight:700}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
  .link-btn{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:4px}
  .tabs{display:flex;gap:6px;position:static;z-index:20;padding:10px 0;background:var(--pitch)}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:12px;cursor:pointer;background:var(--panel);border:1px solid var(--faint);color:var(--muted);font-weight:600;font-size:13.5px;letter-spacing:.02em}
  .tab.active{background:var(--raise);color:var(--line);border-color:rgba(255,200,69,.4)}
  .tab.key{overflow:hidden}
  .tab.key .tk-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:bottom;transition:max-width .3s ease,opacity .22s ease,margin-left .3s ease}
  .tab.key.on{background:var(--raise);color:var(--line);border-color:rgba(255,200,69,.4)}
  .tab.key.on .tk-label{max-width:100px;opacity:1}
  @media (hover:hover){
    .tab.key:not(.on):hover .tk-label{max-width:100px;opacity:1;margin-left:6px}
  }
  .eqcrest{display:inline-flex;align-items:center}
  .eqcrest .crest{width:18px;height:18px;object-fit:contain;border-radius:4px}
  .datesel{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
  .datechips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 1px;scrollbar-width:none;-ms-overflow-style:none}
  .datechips::-webkit-scrollbar{display:none}
  .datechip{flex:none;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--faint);color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap;cursor:pointer;letter-spacing:.02em}
  .datechip.active{background:var(--raise);color:var(--line);border-color:rgba(255,200,69,.5)}
  .datechip.hoy{color:var(--gold)}
  .dayarrow{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--faint);color:var(--line);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .dayarrow:disabled{opacity:.28;cursor:default}
  .daygroup{margin-top:18px}
  .dayhead{display:flex;align-items:center;gap:12px;margin:6px 2px 12px}
  .dayhead .d{font-family:var(--display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--line);white-space:nowrap}
  .dayhead .rule{height:1px;background:linear-gradient(90deg,var(--gold2),transparent);flex:1}
  .match{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--faint);border-radius:var(--r);padding:12px 12px 11px;margin-bottom:11px;position:relative;overflow:hidden}
  .match.col{border-color:rgba(255,200,69,.5);box-shadow:0 0 0 1px rgba(255,200,69,.15)}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .grp{font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--raise);border-radius:6px;padding:5px 7px}
  .grp.colrib{color:var(--pitch);background:var(--gold);font-weight:700}
  .when{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.25}
  .when .cd{display:block;font-family:var(--score);font-size:15px;letter-spacing:.03em;color:var(--mint);font-weight:600}
  .when .cd.soon{color:var(--flare)}
  .when .cd.closed{color:var(--muted)}
  .team{display:flex;align-items:center;gap:10px;padding:6px 0}
  .editnm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;flex:none;opacity:.7}
  .editnm:hover{opacity:1}
  .team .fl{font-size:22px;width:26px;text-align:center;flex:none;filter:saturate(1.1);display:inline-flex;align-items:center;justify-content:center}
  .team .fl .crest{width:24px;height:24px;object-fit:contain;flex:none;border-radius:4px}
  .team .nm{font-weight:600;font-size:15px;flex:1;min-width:0}
  .team .nm.win{color:var(--gold)}
  .box{font-family:var(--score);font-weight:600;width:46px;height:46px;flex:none;text-align:center;font-size:26px;color:var(--gold);background:#06120d;border:1px solid rgba(255,200,69,.25);border-radius:10px;line-height:46px;padding:0;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
  input.box{outline:none;-moz-appearance:textfield}
  input.box::-webkit-outer-spin-button,input.box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.box:focus{border-color:var(--mint);box-shadow:inset 0 0 12px rgba(0,0,0,.6),0 0 0 2px rgba(54,224,191,.35)}
  input.box:disabled{color:var(--muted);border-color:var(--faint);opacity:.85}
  .divider{height:1px;background:var(--faint);margin:3px 0}
  .mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;min-height:20px}
  .status{font-size:12px;color:var(--muted)}
  .status.locked{color:var(--flare);font-weight:600}
  .pts{font-family:var(--score);font-weight:700;font-size:17px;padding:2px 9px;border-radius:8px;letter-spacing:.02em}
  .pts.p3{background:var(--gold);color:var(--pitch)}
  .pts.p1{background:rgba(54,224,191,.18);color:var(--mint)}
  .pts.p0{background:var(--raise);color:var(--muted)}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;background:linear-gradient(180deg,transparent,rgba(7,18,13,.96) 30%);padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .savebar .inner{max-width:640px;margin:0 auto}
  .btn{display:block;width:100%;border:none;cursor:pointer;border-radius:14px;padding:15px;font:700 16px var(--body);letter-spacing:.02em;background:var(--gold);color:#231600;box-shadow:0 8px 26px rgba(255,200,69,.28)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--panel);color:var(--line);border:1px solid var(--faint);box-shadow:none}
  .btn.saving{background:var(--raise);color:var(--gold);box-shadow:none;cursor:wait;display:flex;align-items:center;justify-content:center;gap:10px}
  .lead{margin-top:8px}
  .leadhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 14px}
  .leadhead .t{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.06em}
  .leadhead .meta{font-size:12px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--faint);margin-bottom:9px}
  .row.me{border-color:rgba(54,224,191,.5)}
  .row .rank{font-family:var(--score);font-size:24px;font-weight:700;width:30px;text-align:center;color:var(--muted)}
  .row.top1 .rank{color:var(--gold)}.row.top2 .rank{color:#cfd8d2}.row.top3 .rank{color:#e6a86b}
  .row.top1{background:linear-gradient(180deg,rgba(255,200,69,.16),var(--panel));border-color:rgba(255,200,69,.45)}
  .row .who{flex:1;min-width:0}
  .row .who .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
  .row .who .nm .ico{font-size:16px}
  .row .who .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row .score{text-align:right}
  .row .score .pp{font-family:var(--score);font-size:30px;font-weight:700;line-height:1;color:var(--gold)}
  .row .score .lbl{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;line-height:1.6}
  .empty .big{font-size:34px;display:block;margin-bottom:10px}
  .rules{background:var(--panel);border:1px solid var(--faint);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6}
  .rules b{color:var(--line)}
  .rules .pill{display:inline-block;font-family:var(--score);font-weight:700;color:var(--gold);font-size:15px;margin-right:2px}
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(5,14,10,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(255,200,69,.3);border-radius:20px;padding:24px}
  .card h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;margin:4px 0 6px;letter-spacing:.04em}
  .card p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.55}
  .field{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;letter-spacing:.04em}
  .input{width:100%;background:#06120d;border:1px solid var(--faint);border-radius:12px;color:var(--line);font:600 16px var(--body);padding:13px 14px;outline:none}
  .input:focus{border-color:var(--mint)}
  .avatars{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
  .av{width:42px;height:42px;border-radius:11px;background:#06120d;border:1px solid var(--faint);font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .av.sel{border-color:var(--gold);background:var(--raise);box-shadow:0 0 0 2px rgba(255,200,69,.3)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--mint);color:#06241d;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.warn{background:var(--flare);color:#fff}
  .addbox{background:var(--panel);border:1px dashed rgba(255,200,69,.4);border-radius:14px;padding:14px;margin:14px 0}
  .addbox .ttl{font-weight:700;margin-bottom:10px;font-size:14px}
  .addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .addgrid .full{grid-column:1/3}
  .mini{background:#06120d;border:1px solid var(--faint);border-radius:10px;color:var(--line);font:500 14px var(--body);padding:11px 12px;outline:none;width:100%}
  .mini:focus{border-color:var(--mint)}
  .smallbtn{background:var(--gold);color:#231600;border:none;border-radius:10px;padding:11px;font:700 14px var(--body);cursor:pointer;width:100%}
  .cols{display:flex;align-items:center;gap:10px;margin:2px 0 1px}
  .cols .sp{flex:1}
  .cols .colh{width:46px;flex:none;text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .box.ro{display:flex;align-items:center;justify-content:center;color:var(--gold);background:#06120d}
  .box.real{display:flex;align-items:center;justify-content:center;color:var(--mint);border-color:rgba(54,224,191,.35)}
  .box.real.live{color:var(--flare);border-color:rgba(255,77,109,.4);animation:pulse-live 2s ease-in-out infinite}
  @keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.6}}
  .mystats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mystats .sb{background:var(--panel);border:1px solid var(--faint);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .mystats .sb b{color:var(--gold);font-family:var(--score);font-size:16px}
  .select-popup { width:100%; background:#06120d; border:1px solid var(--faint); border-radius:12px; color:var(--line); font:600 15px var(--body); padding:13px; outline:none; margin-bottom:15px; }
  .select-popup:focus { border-color:var(--mint); }
  /* --- Animación de guardado (Opción C): balón oscilando, sin prometer tiempo --- */
  .ball-spin{display:inline-block;animation:ballSpin 0.7s ease-in-out infinite;font-size:18px}
  @keyframes ballSpin{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-5px) rotate(180deg);}
  }
  .status.pending{color:var(--gold);font-weight:600}
  /* --- Esqueleto de carga inicial (antes de que responda el backend) ---
     Vive como markup estático en el HTML, no generado por JS, para que
     pinte de inmediato al cargar la página -- sin esperar ninguna llamada
     de red. renderShell() lo reemplaza en cuanto llegan los datos reales
     (o el error correspondiente), así que no necesita lógica para quitarlo. */
  .skel{background:linear-gradient(90deg,var(--panel) 25%,var(--raise) 50%,var(--panel) 75%);background-size:200% 100%;animation:skel-shimmer 1.4s ease-in-out infinite;border-radius:8px}
  @keyframes skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skel-kicker{width:140px;height:11px;margin-top:22px;margin-bottom:10px}
  .skel-title{width:230px;height:36px;margin-bottom:10px}
  .skel-sub{width:88%;height:13px;margin-bottom:18px}
  .skel-chip{width:170px;height:30px;border-radius:999px;margin-bottom:14px}
  .skel-tabs{display:flex;gap:6px;margin:10px 0 20px}
  .skel-tab{flex:1;height:40px;border-radius:12px}
  .skel-card{height:150px;border-radius:var(--r);margin-bottom:11px}
</style>

<div class="wrap" id="root">
  <header>
    <div class="skel skel-kicker"></div>
    <div class="skel skel-title"></div>
    <div class="skel skel-sub"></div>
    <div class="skel skel-chip"></div>
  </header>
  <div class="skel-tabs">
    <div class="skel skel-tab"></div><div class="skel skel-tab"></div><div class="skel skel-tab"></div><div class="skel skel-tab"></div>
  </div>
  <div class="skel skel-card"></div>
  <div class="skel skel-card"></div>
  <div class="skel skel-card"></div>
</div>
<div class="savebar" id="savebar"><div class="inner"></div></div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwVi6hbGVQKPnesmLkR_KSrvVowdHXk7bi5ldBeqcR0_ELzhhhwBsnLOhUTkUlgZkct/exec";

/* --- Multi-tenant con soporte para ?grupo= o ?tab= --- */
const _qp=new URLSearchParams(location.search);
const ES_PANEL_CENTRAL=_qp.get("admin")==="central";
const TAB=(_qp.get("grupo")||_qp.get("tab")||localStorage.getItem("pg_tab")||"fpc2026").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40)||"fpc2026";
localStorage.setItem("pg_tab",TAB);

/* --- Catálogo de torneos ---
   Un solo index.html sirve a TODOS los grupos. Cada grupo elige su torneo al
   crearse (llave "torneoId"), y ese torneo trae su propio fixture, equipos,
   escudos y textos de encabezado. Agregar un torneo nuevo en el futuro
   (La Liga, Libertadores, etc.) es sumar una entrada aquí — no se vuelve a
   tocar la arquitectura ni el multi-tenant. */

      "Deportivo Cali":"🟢", "Millonarios F.C.":"🔵", "Once Caldas DAF":"⚪",
      "Fortaleza":"🏰", "Independiente Santa Fe":"🦁", "Internacional de Bogotá":"🔵",

      "Deportivo Pasto":"🔴", "Boyacá Chicó F.C.":"🟢"
    },
    // Nombre de equipo -> nombre de archivo en /escudos/ (carpeta compartida en la
    // raíz del repo). Mientras un archivo no exista, se usa el emoji de respaldo.
    ESCUDOS:{
      "América de Cali":"america.png","Independiente Medellín":"medellin.png",

      "Jaguares F.C.":"jaguares.png","Atlético Nacional":"nacional.png",
      "Cúcuta Deportivo":"cucuta.png","Deportivo Pereira":"pereira.png",

    EXTRA_ALLOWED:[

      "Por definir (B1)","Por definir (B2)","Por definir (B3)","Por definir (B4)",
      "Ganador Grupo A","Ganador Grupo B"
    ]
  },

    kicker:"La Liga · España",

    subtitulo:"Acierta el resultado y clava el marcador en la liga española.",
    // Nombres tomados directo del fixture ya cargado (mismo texto que usa
    // api-football.com), para que "seguir equipo" y el emparejamiento de
    // partidos usen exactamente la misma grafía — sin escudos propios todavía,
    // cae al ⚽ de respaldo automáticamente en cada equipo.
    FLAG:{
      "Alaves":"⚽","Athletic Club":"⚽","Atletico Madrid":"⚽","Barcelona":"⚽",
      "Celta Vigo":"⚽","Deportivo La Coruna":"⚽","Elche":"⚽","Espanyol":"⚽",

      "Racing Santander":"⚽","Rayo Vallecano":"⚽","Real Betis":"⚽","Real Madrid":"⚽",

  "champions_2026_27":{
    nombre:"UEFA Champions League 2026-27",

    subtitulo:"Acierta el resultado y clava el marcador en la máxima competencia de Europa.",

/* --- Estado del torneo activo del grupo, resuelto en boot() a partir de la
   llave "torneoId" guardada en la nube. Estas variables se llenan una vez que
   se conoce el torneo, con activarTorneo(). --- */
let FIXTURE=[],FLAG={},ESCUDOS={},ALLOWED_TEAMS=[];
function normalizarEquipo(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
let EQUIPO_CANONICO={}; // nombre normalizado -> nombre canónico (el que usan FLAG/ESCUDOS/el filtro de seguimiento)
function nombreCanonico(n){return EQUIPO_CANONICO[normalizarEquipo(n)]||n;}

async function activarTorneo(id){
  const t=TOURNAMENTS[id]||TOURNAMENTS[TOURNAMENT_DEFAULT];
  FLAG=t.FLAG;
  ESCUDOS=t.ESCUDOS;
  ALLOWED_TEAMS=Object.keys(FLAG).concat(t.EXTRA_ALLOWED||[]).sort();
  EQUIPO_CANONICO={};
  Object.keys(FLAG).forEach(nombre=>{EQUIPO_CANONICO[normalizarEquipo(nombre)]=nombre;});
  let partidos=[];
  try{
    const r=await cloudCall({action:"getFixture",torneoId:id});
    if(r&&r.status==="success"){
      partidos=r.partidos||[];
      // Escudos que trae api-football junto al fixture, para equipos sin
      // escudo local curado a mano todavía -- los locales (ESCUDOS de cada
      // torneo en TOURNAMENTS, como los del FPC) siempre ganan si existen.
      if(r.escudos)ESCUDOS=Object.assign({},r.escudos,t.ESCUDOS);
    }
  }catch(e){console.error("No se pudo cargar la malla del torneo:",e);}
  // nombreCanonico() absorbe diferencias de tilde/mayúscula entre lo que devuelve
  // la API y nuestros nombres — así el filtro de "seguir equipo" y los escudos
  // funcionan aunque la API escriba el nombre distinto a como lo adivinamos.
  FIXTURE=partidos.map(r=>({id:r[0],g:r[1],home:nombreCanonico(r[3]),away:nombreCanonico(r[4]),kick:r[2]?new Date(r[2]).getTime():null,venue:r[5]||"Estadio",custom:false}));
}
function crestHtml(archivo,emoji){
  if(!archivo)return emoji;
  // ESCUDOS puede traer un nombre de archivo local (/escudos/xxx.png, como en
  // FPC) o una URL completa (el logo que manda api-football para los demás
  // torneos) -- se detecta cuál es en vez de asumir siempre archivo local.
  const src=/^https?:\/\//.test(archivo)?archivo:"/escudos/"+archivo;
  return`<img class="crest" src="${src}" alt="" data-fallback="${escapeHtml(emoji)}" onerror="this.outerHTML=this.dataset.fallback">`;
}
function flag(n){return crestHtml(ESCUDOS[n],FLAG[n]||"⚽");}

async function cloudCall(data){

}
async function sGet(k,sh){if(!sh)return localStorage.getItem("p:"+k);return CACHE[k]??null;}
async function sSet(k,v,sh){

}

function allMatches(){
  const cm=S.custom.map(c=>({id:c.id,g:c.g||"Extra",home:c.home,away:c.away,kick:c.kick,venue:c.venue||"Estadio Asignado",custom:true}));
  let all=FIXTURE.map(m=>({...m})).concat(cm);
  for(const m of all){
    const ov=S.teamOverrides[m.id];
    if(ov){
      if(ov.home)m.home=ov.home;
      if(ov.away)m.away=ov.away;
      if(ov.kick)m.kick=ov.kick;      // fecha/hora confirmada por el organizador
      if(ov.venue)m.venue=ov.venue;
    }
  }
  // Modo "equipo": el grupo entero sigue solo a su(s) equipo(s) — se filtra
  // DESPUÉS de aplicar teamOverrides, para que un cambio de nombre en un
  // cruce de eliminación (ej. "Por definir" -> el equipo real) también entre.
  if(S.modoSeguimiento==="equipo"&&S.equiposSeguidos.length){
    all=all.filter(m=>S.equiposSeguidos.includes(m.home)||S.equiposSeguidos.includes(m.away));
  }
  // Los partidos sin fecha (kick===null, "por confirmar") van al final,
  // el resto ordenado normalmente por fecha.
  return all.sort((a,b)=>{
    if(a.kick==null&&b.kick==null)return 0;
    if(a.kick==null)return 1;
    if(b.kick==null)return -1;
    return a.kick-b.kick;
  });
}
function outcome(h,a){h=+h;a=+a;if(h>a)return"1";if(h<a)return"2";return"X";}
function ptsFor(p,r){
  if(!p||!r||p.h==null||p.a==null||r.h==null||r.a==null)return null;
  let s=0;
  if(outcome(p.h,p.a)===outcome(r.h,r.a))s+=1;
  if(+p.h===+r.h&&+p.a===+r.a)s+=2;
  return s;
}

/* --- Premios --- */
function fmtCOP(n){return"$"+Math.round(n||0).toLocaleString("es-CO");}
function computePot(){
  const b=S.betting||{};
  const inscripcion=+b.inscripcion||0;
  const jugadores=S.roster.length;
  const total=inscripcion*jugadores;
  const distribuible=total; // peer-to-peer: no hay corte de administración
  const premios=b.premios||{};
  const p1=distribuible*(+premios.p1||0)/100;
  const p2=distribuible*(+premios.p2||0)/100;
  const p3=distribuible*(+premios.p3||0)/100;
  return{inscripcion,jugadores,total,distribuible,p1,p2,p3};
}
const FD=new Intl.DateTimeFormat("es-CO",{weekday:"short",day:"numeric",month:"short"});
const FT=new Intl.DateTimeFormat("es-CO",{hour:"numeric",minute:"2-digit",hour12:true});
function dayKey(ts){return FD.format(ts);}
function whenHtml(kick){return`${cap(FD.format(kick))} · ${FT.format(kick)}`;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function cd(diff){
  if(diff<=0)return null;
  const m=Math.floor(diff/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  if(d>0)return{t:`${d}d ${h}h`,soon:false};
  if(h>0)return{t:`${h}h ${mm}m`,soon:h<2};
  const s=Math.floor((diff%60000)/1000);
  return{t:`${mm}m ${String(s).padStart(2,"0")}s`,soon:true};
}

/* El pronóstico cierra a las 11:59:59pm (hora Colombia) del día ANTERIOR al
   partido — no a la hora exacta del pitazo inicial. El truco de restar/sumar
   5h es el mismo que usamos para el editor de fecha: nos deja calcular sobre
   los dígitos de la hora de Colombia sin depender de en qué huso horario esté
   el navegador de quien está mirando la app. */
function calcularLimite(kickEpoch){
  if(kickEpoch==null)return null;
  const d=new Date(kickEpoch-5*60*60*1000);
  const limite=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-1,23,59,59,999));
  return limite.getTime()+5*60*60*1000;
}

function _hashPin(pin){let h=0;for(let i=0;i<pin.length;i++){h=((h<<5)-h)+pin.charCodeAt(i);h|=0;}return"ph_"+Math.abs(h).toString(36);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function toast(msg,warn,dur){elToast.textContent=msg;elToast.className="toast show"+(warn?" warn":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>elToast.className="toast",dur||1900);}

/* Ayudante genérico para cualquier botón que dispare una acción async (guardar,
   crear, confirmar...): lo deshabilita y le pone el balón girando + texto
   mientras trabaja, y lo devuelve a su estado original al terminar — tanto si
   sale bien como si sale mal. Nunca dice "listo" antes de tiempo: solo indica
   que algo está en curso, igual que la animación de guardar pronósticos. */
async function conCargando(btn,fn,texto){
  if(!btn)return await fn();
  const original=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML=`<span class="ball-spin">⚽</span> ${texto||"Un momento..."}`;
  try{
    return await fn();
  }finally{
    if(document.body.contains(btn)){ // el modal pudo haberse cerrado ya (caso de éxito)
      btn.innerHTML=original;
      btn.disabled=false;
    }
  }
}

function buildDayList(){
  const ms=allMatches().filter(m=>m.kick!=null);
  const map=new Map();
  for(const m of ms){
    const dk=dayKey(m.kick);
    if(!map.has(dk))map.set(dk,{key:dk,label:cap(FD.format(m.kick)),matches:[]});
    map.get(dk).matches.push(m);
  }
  return[...map.values()];
}
function defaultDay(days){
  if(S.selectedDay&&days.some(d=>d.key===S.selectedDay))return S.selectedDay;
  const now=S.now,todayKey=dayKey(now);
  let d=days.find(d=>d.key===todayKey);
  if(d)return d.key;
  d=days.find(d=>d.matches.some(m=>m.kick>now));
  if(d)return d.key;
  return days.length?days[days.length-1].key:null;
}

  html+=`<div class="rules"><div><b>Cómo se ganan los puntos</b></div>

    <div style="margin-top:8px">Cada partido cierra a las 11:59 p.m. del día ANTERIOR al partido — no a la hora exacta del pitazo. Los partidos "por confirmar" quedan abiertos hasta que el organizador defina su fecha.</div></div>`;
  c.innerHTML=html;

  matchesById={};allMatches().forEach(x=>matchesById[x.id]=x);
  const visibles=sinFecha.concat(days.length?days[days.findIndex(d=>d.key===S.selectedDay)].matches:[]);
  for(const m of visibles){
    const hi=document.getElementById("h_"+m.id),ai=document.getElementById("a_"+m.id);
    matchEls[m.id]={hi,ai,cd:document.getElementById("cd_"+m.id),foot:document.getElementById("foot_"+m.id)};
    const onIn=()=>handleInput(m.id);
    if(hi)hi.oninput=onIn;if(ai)ai.oninput=onIn;
    paintFoot(m);
  }
  const datechipsEl=document.getElementById("datechips");
  if(datechipsEl){
    datechipsEl.querySelectorAll(".datechip").forEach(ch=>{
      ch.onclick=()=>{S.selectedDay=days[+ch.dataset.idx].key;renderView();};
    });
    const activeIdx=days.findIndex(d=>d.key===S.selectedDay);
    const prevBtn=document.getElementById("prevDay"),nextBtn=document.getElementById("nextDay");

    const activeChip=document.querySelector(".datechip.active");
    if(activeChip)activeChip.scrollIntoView({behavior:"instant",inline:"center",block:"nearest"});
  }
}

function clampVal(v){if(v==="")return"";let n=parseInt(v,10);if(isNaN(n))return"";if(n<0)n=0;if(n>49)n=49;return n;}
function handleInput(id){
  const e=matchEls[id];if(!e)return;
  let h=clampVal(e.hi.value),a=clampVal(e.ai.value);
  if(e.hi.value!==String(h))e.hi.value=h;
  if(e.ai.value!==String(a))e.ai.value=a;
  if(h===""||a==="")delete S.predsMe[id];else S.predsMe[id]={h,a};
  S.dirty.add(id);updateSaveBar();paintFoot(matchesById[id]);
}

function paintFoot(m){
  if(!m)return;
  const e=matchEls[m.id];if(!e||!e.foot)return;
  const locked=m.kick!=null&&S.now>=calcularLimite(m.kick),res=S.results[m.id],p=S.predsMe[m.id];
  const sinGuardar=S.dirty.has(m.id); // escrito pero todavía no confirmado por el servidor
  let left="",right="";
  if(res){
    if(p){const pp=ptsFor(p,res);const cls=pp===3?"p3":(pp===1?"p1":"p0");const txt=pp===3?"¡Marcador exacto!":(pp===1?"Acertaste el ganador":"No acertaste");left=`<span class="status">${txt}</span>`;right=`<span class="pts ${cls}">+${pp} pts</span>`;}
    else{left=`<span class="status">No pronosticaste</span>`;right=`<span class="pts p0">0 pts</span>`;}
  }else if(locked){
    left=`<span class="status locked">🔒 Cerrado</span>`;
    right=p?`<span class="status">Tu pronóstico: <b style="color:var(--line)">${p.h}–${p.a}</b></span>`:`<span class="status">Sin pronóstico</span>`;
  }else{
    left=`<span class="status">Abierto · escribe tu pronóstico</span>`;
    if(p&&sinGuardar){
      right=`<span class="status pending">✏️ ${p.h}–${p.a} escrito · falta guardar</span>`;
    }else if(p){
      right=`<span class="status" style="color:var(--mint);font-weight:700">✓ ${p.h}–${p.a} guardado</span>`;
    }else{
      right=`<span class="status" style="color:var(--flare)">⚠️ sin pronóstico</span>`;
    }
  }
  e.foot.innerHTML=`<span>${left}</span><span>${right}</span>`;
}

function updateSaveBar(){
  const bar=document.getElementById("savebar"),inner=bar.firstElementChild;
  if(S.view==="partidos"&&S.savingPreds){
    inner.innerHTML=`<button class="btn saving" id="saveBtn" disabled><span class="ball-spin">⚽</span><span id="savingLabel">Guardando...</span></button>`;

    document.getElementById("saveBtn").onclick=savePreds;bar.style.display="block";

async function savePreds(){
  const byId={};allMatches().forEach(m=>byId[m.id]=m);
  let dropped=0;
  for(const id of[...S.dirty]){const m=byId[id];if(m&&m.kick!=null&&S.now>=calcularLimite(m.kick)){dropped++;S.dirty.delete(id);}}
  const cantidadEnEstaAccion=S.dirty.size; // lo que de verdad se está enviando AHORA, no el histórico

  if(cantidadEnEstaAccion===0){
    // Todo lo pendiente se cerró justo antes de guardar — no hay nada real
    // que enviar, así que ni siquiera llamamos al servidor.
    updateSaveBar();allMatches().forEach(m=>paintFoot(m));paintMyStats();paintPendingBanner();
    toast(`❌ ${dropped} partido${dropped===1?"":"s"} ya cerrado${dropped===1?"":"s"} — no se pudo enviar.`,true,5000);
    return;
  }

  // --- Animación honesta: dura exactamente lo que dure la espera real, nunca
  // promete un tiempo ni confirma nada antes de que el servidor responda. ---
  S.savingPreds=true;updateSaveBar();
  const mensajes=["⚽ Guardando...","🥅 Ya casi...","✨ Anotando..."];
  let mi=0;
  const msgInterval=setInterval(()=>{
    mi=(mi+1)%mensajes.length;
    const lbl=document.getElementById("savingLabel");
    if(lbl)lbl.textContent=mensajes[mi];
  },2200);

  const ok=await setJSONPlayerAuth("preds_"+S.me.id,S.predsMe);
  if(ok){
    // Solo llamamos a joinRoster si de verdad hace falta (registro nuevo o
    // cambió nombre/avatar) — chequeo local, sin viaje de red, así que no
    // cuesta nada hacerlo siempre, pero evita el segundo POST innecesario.
    const yaEnRoster=S.roster.some(p=>p.id===S.me.id&&p.name===S.me.name&&p.ico===S.me.ico);
    if(!yaEnRoster)await joinRoster();
    S.allPreds[S.me.id]=Object.assign({},S.predsMe);
    S.dirty.clear(); // solo se limpia si el guardado fue confirmado de verdad
  }

  clearInterval(msgInterval);
  S.savingPreds=false;
  updateSaveBar();allMatches().forEach(m=>paintFoot(m));paintMyStats();paintPendingBanner();
  if(!ok)toast("❌ No se pudo guardar. Revisa tu conexión y vuelve a intentar.",true,5000);
  else if(dropped>0)toast(`✅ ${cantidadEnEstaAccion} actualizado${cantidadEnEstaAccion===1?"":"s"}. ${dropped} ya cerrado${dropped===1?"":"s"}, no se envió.`,false,5500);
  else toast(`✅ ${cantidadEnEstaAccion} pronóstico${cantidadEnEstaAccion===1?"":"s"} actualizado${cantidadEnEstaAccion===1?"":"s"}`,false,4000);
}

/* --- Ranking --- */
function buildBoard(){
  const ms=allMatches();
  const finished=ms.filter(m=>S.results[m.id]);
  const board=S.roster.map(pl=>{
    const preds=S.allPreds[pl.id]||{};
    let pts=0,ex=0,ac=0,played=0;
    for(const m of finished){const p=preds[m.id],r=S.results[m.id];if(p){played++;const s=ptsFor(p,r);pts+=s;if(s===3)ex++;if(s>=1)ac++;}}
    return{...pl,pts,ex,ac,played};
  });
  board.sort((a,b)=>b.pts-a.pts||b.ex-a.ex||b.ac-a.ac||a.name.localeCompare(b.name));
  return{board,finished:finished.length,total:ms.length};
}
function renderRanking(c){
  const{board,finished,total}=buildBoard();
  const pot=computePot();
  const premioHtml=pot.total>0?`<div class="rules" style="margin-bottom:14px;border-color:rgba(255,200,69,.35)">
    <div><b>🏆 Bote total: <span style="color:var(--gold)">${fmtCOP(pot.total)}</span></b> <span style="color:var(--muted);font-size:12px">(${pot.jugadores} jugador${pot.jugadores===1?"":"es"} inscrito${pot.jugadores===1?"":"s"})</span></div>
    <div style="margin-top:8px">🥇 <b style="color:var(--gold)">${fmtCOP(pot.p1)}</b> &nbsp; 🥈 <b style="color:var(--line)">${fmtCOP(pot.p2)}</b> &nbsp; 🥉 <b style="color:var(--line)">${fmtCOP(pot.p3)}</b></div>
  </div>`:"";
  if(board.length===0){c.innerHTML=premioHtml+`<div class="empty"><span class="big">🏟️</span>Todavía nadie se ha unido.</div>`;return;}
  let rows="";
  board.forEach((p,i)=>{
    const rank=i+1,mine=S.me&&p.id===S.me.id;
    const topcls=rank===1?"top1":rank===2?"top2":rank===3?"top3":"";
    const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"";
    rows+=`<div class="row ${topcls} ${mine?"me":""}">
      <div class="rank">${rank}</div>
      <div class="who"><div class="nm"><span class="ico">${p.ico||"⚽"}</span>${escapeHtml(p.name)}${mine?' <span style="color:var(--mint);font-size:11px;font-weight:600">· tú</span>':""} ${medal}</div>
      <div class="sub">${p.ex} exacto(s) · ${p.ac} acierto(s) · ${p.played} jugados</div></div>
      <div class="score"><div class="pp">${p.pts}</div><div class="lbl">pts</div></div>
    </div>`;
  });
  c.innerHTML=premioHtml+`<div class="lead"><div class="leadhead"><span class="t">Ranking</span><span class="meta">Resultados: ${finished}/${total}</span></div>${rows}</div>`;
}

    <button class="btn ghost" id="ems_cancel" style="margin-top:10px">Cancelar</button>
  </div>`;
  document.getElementById("ems_cancel").onclick=()=>ov.remove();
  document.getElementById("ems_clear").onclick=async()=>{
    await conCargando(document.getElementById("ems_clear"),async()=>{
      S.teamOverrides[id]=S.teamOverrides[id]||{};
      S.teamOverrides[id].kick=null;
      const ok=await setJSONAuth("teamOverrides",S.teamOverrides);
      if(!ok)return;
      ov.remove();
      toast("Partido movido a \"Por confirmar\" ✓",false,3000);
      if(S.view==="resultados")renderResultados(document.getElementById("content"));
    },"Un momento...");
  };
  document.getElementById("ems_save").onclick=async()=>{
    const val=document.getElementById("ems_kick").value;
    const venue=document.getElementById("ems_venue").value.trim();
    const err=document.getElementById("ems_err");
    if(val){
      const testEpoch=new Date(val+":00-05:00").getTime();
      if(isNaN(testEpoch)){err.textContent="Fecha inválida.";return;}
    }
    await conCargando(document.getElementById("ems_save"),async()=>{
      S.teamOverrides[id]=S.teamOverrides[id]||{};
      if(val)S.teamOverrides[id].kick=new Date(val+":00-05:00").getTime();
      if(venue)S.teamOverrides[id].venue=venue;
      const ok=await setJSONAuth("teamOverrides",S.teamOverrides);
      if(!ok)return;
      ov.remove();
      toast("Partido actualizado ✓",false,3000);
      if(S.view==="resultados")renderResultados(document.getElementById("content"));
    },"Guardando...");
  };
}

function renderResultados(c){
  S.resDirty=S.resDirty||new Set();S.resWork=Object.assign({},S.results);
  const ms=allMatches().slice().sort((a,b)=>{
    if(a.kick==null&&b.kick==null)return 0;
    if(a.kick==null)return -1;
    if(b.kick==null)return 1;
    return b.kick-a.kick;
  });
  
  let html=`<div class="rules" style="margin-top:8px;margin-bottom:14px">ID del grupo: <b style="color:var(--gold)">${TAB}</b> · Configura los clasificados con ✏️, la fecha/hora/sede con 📅 (solo mientras no tenga resultado), e ingresa marcadores.</div>`;
  html+=`<div style="text-align:right;margin-bottom:10px"><button class="link-btn" id="rs_salir">🔑 salir del modo organizador</button></div>`;
  html+=`<div class="addbox" style="border-color:rgba(255,200,69,.4);margin-bottom:15px"><button class="smallbtn full" onclick="showGroupEdit()" style="background:var(--raise);color:var(--gold)">✏️ Editar nombre del grupo / PIN admin</button></div>`;
  html+=`<div class="addbox" style="border-color:rgba(54,224,191,.4);margin-bottom:15px"><button class="smallbtn full" onclick="showModoSeguimiento()" style="background:var(--raise);color:var(--mint)">⚽ Modo de seguimiento (equipo o torneo completo)</button></div>`;
  html+=`<div class="addbox" style="border-color:rgba(255,77,109,.4);margin-bottom:15px"><button class="smallbtn full" onclick="showPinReset()" style="background:var(--raise);color:var(--flare)">🔑 Resetear PIN de jugador</button></div>`;
  html+=`<div class="addbox" style="border-color:rgba(255,200,69,.4);margin-bottom:15px"><button class="smallbtn full" onclick="showBettingConfig()" style="background:var(--raise);color:var(--gold)">💰 Configurar premios / inscripción</button></div>`;
  
  for(const m of ms){
    const r=S.resWork[m.id]||{},locked=m.kick!=null&&S.now>=m.kick,sinFecha=m.kick==null;
    const tieneResultado=!!S.results[m.id];
    const cuandoLabel=sinFecha?`<span style="color:var(--flare)">📋 Sin fecha confirmada</span>`:`${whenHtml(m.kick)} ${locked?"":"<span style='color:var(--flare)'>· aún no inicia</span>"}`;
    const btnFecha=tieneResultado?"":`<button class="editnm" data-mid="${m.id}" data-kick="${m.kick||""}" data-venue="${escapeHtml(m.venue)}" title="Editar fecha/hora/sede" onclick="editMatchSchedule('${m.id}',${m.kick||"null"},'${escapeHtml(m.venue).replace(/'/g,"&#39;")}')">📅</button>`;
    html+=`<div class="match" style="border-radius:14px">
      <div class="mtop"><span class="grp">🏆 ${m.g}</span>
      <span class="when">${cuandoLabel} ${btnFecha}</span></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">📍 ${escapeHtml(m.venue)}</div>
      <div class="team"><span class="fl">${flag(m.home)}</span><span class="nm">${escapeHtml(m.home)}</span><button class="editnm" data-mid="${m.id}" data-side="home" data-cur="${escapeHtml(m.home)}" title="Editar nombre">✏️</button><input class="box" id="rh_${m.id}" type="number" inputmode="numeric" min="0" max="49" placeholder="–" value="${r.h!=null?r.h:""}"></div>
      <div class="divider"></div>
      <div class="team"><span class="fl">${flag(m.away)}</span><span class="nm">${escapeHtml(m.away)}</span><button class="editnm" data-mid="${m.id}" data-side="away" data-cur="${escapeHtml(m.away)}" title="Editar nombre">✏️</button><input class="box" id="ra_${m.id}" type="number" inputmode="numeric" min="0" max="49" placeholder="–" value="${r.a!=null?r.a:""}"></div>
    </div>`;
  }
  c.innerHTML=html;
  document.getElementById("rs_salir").onclick=salirModoOrganizador;

  c.querySelectorAll(".editnm[data-side]").forEach(b=>{
    b.onclick=()=>editTeamName(b.dataset.mid,b.dataset.side,b.dataset.cur);
  });
  for(const m of ms){
    const rh=document.getElementById("rh_"+m.id),ra=document.getElementById("ra_"+m.id);
    if(!rh||!ra)continue;
    const on=()=>{
      let h=clampVal(rh.value),a=clampVal(ra.value);
      if(rh.value!==String(h))rh.value=h;if(ra.value!==String(a))ra.value=a;
      if(h===""||a==="")delete S.resWork[m.id];else S.resWork[m.id]={h,a};
      S.resDirty.add(m.id);updateSaveBar();
    };
    rh.oninput=on;ra.oninput=on;
  }
  updateSaveBar();
}

/* --- Onboarding --- */
async function showOnboarding(isChange){
  const old=document.getElementById("ovl");if(old)old.remove();
  const ov=document.createElement("div");ov.className="overlay";ov.id="ovl";
  document.body.appendChild(ov);
  const roster=(await getJSON("roster",true))||[];

  function renderSelectScreen(){
    pendingIco=AVATARS[0];
    ov.innerHTML=`<div class="card" style="max-height:90vh;overflow-y:auto">
      <div class="kicker" style="color:var(--mint)">Bienvenido a la polla de ${escapeHtml((TOURNAMENTS[S.torneoId]||TOURNAMENTS[TOURNAMENT_DEFAULT]).nombre)}</div>
      <h2>¿Quién juega?</h2>
      ${roster.length>0?`
        <input class="input" id="search_in" placeholder="🔍 Buscar jugador..." style="margin-bottom:10px">
        <div id="player_list" style="display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:14px"></div>
        <div style="height:1px;background:var(--faint);margin:10px 0"></div>
      `:`<p style="color:var(--muted);font-size:13px;margin:0 0 16px">¡Sé el primero en registrarte!</p>`}
      <button class="btn ghost" id="newPlayerBtn">➕ Soy nuevo / registrarme</button>
      ${isChange?`<button class="btn ghost" id="cancelBtn" style="margin-top:10px;border-color:var(--flare);color:var(--flare)">Cancelar</button>`:""}
    </div>`;
    function renderList(filter){
      const list=document.getElementById("player_list");if(!list)return;
      const filtered=roster.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));
      if(!filtered.length){list.innerHTML=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px">Sin resultados</div>`;return;}
      list.innerHTML=filtered.map(p=>`<button class="player-row" data-id="${p.id}" style="display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--faint);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--line);font:inherit;text-align:left">
        <span style="font-size:22px">${p.ico||"⚽"}</span><span style="font-weight:700;font-size:15px;flex:1">${escapeHtml(p.name)}</span><span style="color:var(--muted);font-size:12px">→</span></button>`).join("");
      list.querySelectorAll(".player-row").forEach(btn=>{
        btn.onclick=()=>{const pl=roster.find(p=>p.id===btn.dataset.id);if(pl)renderPinScreen(pl);};
      });
    }
    renderList("");
    const si=document.getElementById("search_in");if(si)si.oninput=()=>renderList(si.value);
    document.getElementById("newPlayerBtn").onclick=renderNewPlayerScreen;
    const cb=document.getElementById("cancelBtn");if(cb)cb.onclick=()=>ov.remove();
  }

  function renderPinScreen(player){
    ov.innerHTML=`<div class="card">
      <button id="backBtn" style="background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:6px">← Volver</button>
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:42px">${player.ico||"⚽"}</div>
        <div style="font-weight:700;font-size:18px;margin-top:6px">${escapeHtml(player.name)}</div>
      </div>
      <label class="field">Tu PIN de 4 dígitos</label>
      <input class="input" id="pin_in" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:24px;text-align:center">
      <div id="pin_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:6px;text-align:center"></div>
      <button class="btn" id="enterBtn" style="margin-top:14px">Entrar</button>
      <button id="forgotBtn" style="background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:10px;display:block;margin:0 auto">Olvidé mi PIN</button>
    </div>`;
    document.getElementById("backBtn").onclick=renderSelectScreen;
    const pi=document.getElementById("pin_in");
    setTimeout(()=>pi.focus(),80);
    async function tryLogin(){
      const pin=pi.value.trim();
      if(pin.length<4){document.getElementById("pin_err").textContent="El PIN debe tener 4 dígitos.";return;}
      await conCargando(document.getElementById("enterBtn"),async()=>{
        const r=await cloudCall({action:"loginJugador",playerId:player.id,pin:_hashPin(pin)});
        if(!r||r.status!=="success"){
          document.getElementById("pin_err").textContent=(r&&r.message)||"PIN incorrecto.";
          pi.value="";pi.focus();return;
        }
        await _loginPlayer(player,pin,!!r.nuevo);
      },"Entrando...");
    }
    document.getElementById("enterBtn").onclick=tryLogin;
    pi.onkeydown=e=>{if(e.key==="Enter")tryLogin();};
    document.getElementById("forgotBtn").onclick=()=>{
      ov.innerHTML=`<div class="card">
        <h2 style="font-size:20px">PIN olvidado</h2>
        <p style="color:var(--muted);font-size:13px">Contacta al organizador para resetearlo.</p>
        <button class="btn ghost" id="backBtn2" style="margin-top:16px">← Volver</button>
      </div>`;
      document.getElementById("backBtn2").onclick=()=>renderPinScreen(player);
    };
  }

  function renderNewPlayerScreen(){
    pendingIco=AVATARS[0];
    ov.innerHTML=`<div class="card" style="max-height:90vh;overflow-y:auto">
      <button id="backBtn" style="background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:0 0 12px;display:flex;align-items:center;gap:6px">← Volver</button>
      <div class="kicker" style="color:var(--mint)">Nuevo jugador</div>
      <h2>Crea tu perfil</h2>
      <label class="field">Tu nombre</label>
      <input class="input" id="nm_in" maxlength="20" placeholder="Ej: Carlos">
      <div class="avatars" id="avs" style="margin:14px 0 16px"></div>
      <label class="field">PIN de 4 dígitos</label>
      <input class="input" id="pin1_in" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:24px;text-align:center">
      <label class="field" style="margin-top:10px">Confirma tu PIN</label>
      <input class="input" id="pin2_in" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:24px;text-align:center">
      <div id="reg_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:6px;text-align:center"></div>
      <button class="btn" id="regBtn">Registrarme y entrar</button>
    </div>`;
    document.getElementById("backBtn").onclick=renderSelectScreen;
    const avs=ov.querySelector("#avs");
    AVATARS.forEach(a=>{
      const d=document.createElement("div");d.className="av"+(a===pendingIco?" sel":"");d.textContent=a;
      d.onclick=()=>{pendingIco=a;avs.querySelectorAll(".av").forEach(x=>x.classList.toggle("sel",x.textContent===a));};
      avs.appendChild(d);
    });
    const inp=document.getElementById("nm_in");setTimeout(()=>inp.focus(),80);
    document.getElementById("regBtn").onclick=async()=>{
      const name=inp.value.trim();
      const pin1=document.getElementById("pin1_in").value.trim();
      const pin2=document.getElementById("pin2_in").value.trim();
      const err=document.getElementById("reg_err");
      const btn=document.getElementById("regBtn");
      if(!name){inp.focus();inp.style.borderColor="var(--flare)";err.textContent="Escribe tu nombre.";return;}
      if(pin1.length<4){err.textContent="PIN de 4 dígitos.";return;}
      if(pin1!==pin2){err.textContent="Los PINes no coinciden.";return;}
      if(roster.find(p=>p.name.toLowerCase()===name.toLowerCase())){err.textContent="Ese nombre ya existe.";return;}
      await conCargando(btn,async()=>{
        const newId="p_"+Math.random().toString(36).slice(2,9);
        const pinHash=_hashPin(pin1);
        const rLogin=await cloudCall({action:"loginJugador",playerId:newId,pin:pinHash});
        if(!rLogin||rLogin.status!=="success"){
          err.textContent=(rLogin&&rLogin.message)||"No se pudo registrar el PIN. Intenta de nuevo.";
          return;
        }
        S.me={id:newId,name,ico:pendingIco};
        await setJSON("me",S.me,false);
        S.mePinHash=pinHash;
        localStorage.setItem("pg_pinp_"+TAB+"_"+newId,pinHash);
        const r=await joinRoster();
        if(r&&r.status==="name_taken"){
          err.textContent="Nombre ocupado justo ahora.";
          S.me=null;await setJSON("me",null,false);
          return;
        }
        ov.remove();renderShell();renderView();
        toast(`¡Bienvenido ${name}!`,false,5000);
      },"Registrando...");
    };
  }

  async function _loginPlayer(player,pin,isFirstTime){
    S.me={id:player.id,name:player.name,ico:player.ico};
    await setJSON("me",S.me,false);
    S.mePinHash=_hashPin(pin);
    localStorage.setItem("pg_pinp_"+TAB+"_"+player.id,S.mePinHash);
    await _migrarPronosticos(player.id);
    S.predsMe=(await getJSON("preds_"+player.id,true))||{};
    await joinRoster();
    ov.remove();renderShell();renderView();
    if(!isFirstTime)toast(`¡Hola ${player.name}!`,false,3000);
  }

  if(isChange&&S.me){
    const player=roster.find(p=>p.id===S.me.id);
    if(player){renderPinScreen(player);return;}
  }
  renderSelectScreen();
}

async function joinRoster(){
  const r=await cloudCall({action:"joinRoster",player:S.me});
  if(r&&r.status==="success"&&r.roster){
    S.roster=r.roster;
    CACHE["roster"]=JSON.stringify(r.roster);
  } else if(!(r&&r.status==="name_taken")&&!S.roster.some(p=>p.id===S.me.id)){
    S.roster.push(S.me);
  }
  return r;
}

async function _migrarPronosticos(targetId){
  try{
    const existing=await getJSON("preds_"+targetId,true);
    if(existing&&Object.keys(existing).length>0)return;
    const roster=(await getJSON("roster",true))||[];
    const myName=S.me.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const oldEntry=roster.find(p=>p.id!==targetId&&p.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")===myName&&p.id.startsWith("p_"));
    if(oldEntry){
      const oldPreds=await getJSON("preds_"+oldEntry.id,true);
      if(oldPreds&&Object.keys(oldPreds).length>0)await setJSONPlayerAuth("preds_"+targetId,oldPreds);
    }
  }catch(e){console.error("Error migrando:",e);}
}

/* --- Tick --- */
function tick(){
  if(ES_PANEL_CENTRAL)return;
  S.now=Date.now();
  if(S.view!=="partidos")return;
  for(const m of allMatches()){
    const e=matchEls[m.id];if(!e)continue;
    if(m.kick==null){
      if(e.hi&&e.hi.disabled){e.hi.disabled=false;e.ai.disabled=false;paintFoot(m);}
      continue;
    }
    const limite=calcularLimite(m.kick);
    const diff=limite-S.now,info=cd(diff);
    if(e.cd){if(info){e.cd.textContent="Cierra en "+info.t;e.cd.className="cd"+(info.soon?" soon":"");}else{e.cd.textContent="Cerrado";e.cd.className="cd closed";}}
    const locked=S.now>=limite;
    if(e.hi&&e.hi.disabled!==locked){e.hi.disabled=locked;e.ai.disabled=locked;paintFoot(m);}
  }
}
setInterval(tick,1000);

/* --- Sync --- */
async function refreshShared(){
  if(ES_PANEL_CENTRAL)return;
  try{
    const ok=await fetchAllShared();if(!ok)return;
    const roster=(await getJSON("roster",true))||S.roster;
    const results=(await getJSON("results",true))||{};
    const custom=(await getJSON("custom",true))||[];
    S.roster=roster;S.custom=custom;
    S.live=(await getJSON("live",true))||{};
    S.betting=(await getJSON("betting",true))||S.betting;
    S.modoSeguimiento=(await getJSON("modoSeguimiento",true))||S.modoSeguimiento;
    S.equiposSeguidos=(await getJSON("equiposSeguidos",true))||S.equiposSeguidos;
    const resChanged=JSON.stringify(results)!==JSON.stringify(S.results);
    S.results=results;
    const preds={};
    for(const pl of roster)preds[pl.id]=(await getJSON("preds_"+pl.id,true))||{};
    S.allPreds=preds;
    if(S.me){
      const fresh=(await getJSON("preds_"+S.me.id,true))||{};
      for(const id of S.dirty)if(S.predsMe[id]!=null)fresh[id]=S.predsMe[id];
      const changed=JSON.stringify(fresh)!==JSON.stringify(S.predsMe);
      S.predsMe=fresh;S.allPreds[S.me.id]=Object.assign({},S.predsMe);
      if(S.view==="ranking")renderRanking(document.getElementById("content"));
      else if(S.view==="envivo")renderEnVivo(document.getElementById("content"));
      else if(S.view==="partidos"&&(resChanged||changed)&&S.dirty.size===0)renderPartidos(document.getElementById("content"));
      else if(S.view==="partidos"&&resChanged)allMatches().forEach(m=>paintFoot(m));
    }else{
      if(S.view==="ranking")renderRanking(document.getElementById("content"));
      else if(S.view==="envivo")renderEnVivo(document.getElementById("content"));
      else if(S.view==="partidos"&&resChanged)allMatches().forEach(m=>paintFoot(m));
    }
    paintMyStats();paintPendingBanner();
  }catch(e){console.error(e);}
}
setInterval(refreshShared,25000);
window.addEventListener("focus",refreshShared);

/* --- Panel Central del Administrador (predigoles.com/?admin=central) ---
   Completamente separado del flujo normal de un grupo. Protegido con el PIN
   maestro (nunca el mismo PIN de ningún grupo individual). Aquí nacen todos
   los grupos nuevos — ya no existe autoconfiguración espontánea. */
let PC_masterHash=null;
let PC_grupos=[];

function pcCard(inner){
  root.innerHTML=`<div style="max-width:520px;margin:40px auto;padding:0 14px">${inner}</div>`;
}

function bootPanelCentral(){
  pcCard(`<div class="card" style="max-width:100%">

    <h2>Acceso</h2>

    <label class="field">PIN maestro</label>
    <input class="input" id="pc_pin" type="password" inputmode="numeric" style="letter-spacing:.3em;font-size:22px;text-align:center">
    <div id="pc_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:8px;text-align:center"></div>
    <button class="btn" id="pc_entrar" style="margin-top:10px">Entrar</button>
  </div>`);
  const pi=document.getElementById("pc_pin");
  setTimeout(()=>pi.focus(),80);
  async function intentar(){
    const err=document.getElementById("pc_err");
    await conCargando(document.getElementById("pc_entrar"),async()=>{
      const hash=_hashPin(pi.value.trim());
      const r=await cloudCall({action:"adminListarGrupos",masterPin:hash});
      if(r&&r.status==="success"){
        PC_masterHash=hash;
        PC_grupos=r.grupos||[];

      }else{
        err.textContent=(r&&r.message)||"No se pudo conectar.";

    },"Entrando...");
  }
  document.getElementById("pc_entrar").onclick=intentar;
  pi.onkeydown=e=>{if(e.key==="Enter")intentar();};
}

function fmtFechaCorta(iso){
  if(!iso)return"—";
  try{return cap(FD.format(new Date(iso).getTime()));}catch(e){return"—";}
}

function showCrearGrupo(){
  const old=document.getElementById("ovl");if(old)old.remove();

  function listaEquiposHtml(torneoId){
    const conf=TOURNAMENTS[torneoId]||{},flagsT=conf.FLAG||{},escudosT=conf.ESCUDOS||{};
    const equipos=Object.keys(flagsT).sort();
    return equipos.map(eq=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
      <input type="checkbox" class="cg_eq" value="${escapeHtml(eq)}"> <span class="eqcrest">${crestHtml(escudosT[eq],flagsT[eq]||"⚽")}</span>${escapeHtml(eq)}
    </label>`).join("");
  }
  ov.innerHTML=`<div class="card" style="max-height:90vh;overflow-y:auto">
    <div class="kicker" style="color:var(--gold)">Panel Central</div>
    <h2>Crear grupo</h2>
    <label class="field">ID del grupo (para el link — solo letras, números, guiones)</label>
    <input class="input" id="cg_id" maxlength="40" placeholder="ej: cliente-oficina1">
    <label class="field" style="margin-top:12px">Nombre del grupo</label>
    <input class="input" id="cg_nombre" maxlength="30" placeholder="Ej: Polla Oficina Cliente X">

    <label class="field" style="font-weight:400">
      <input type="radio" name="cg_modo" value="torneo" checked> &nbsp;El torneo completo

    <label class="field" style="font-weight:400;margin-top:6px">
      <input type="radio" name="cg_modo" value="equipo"> &nbsp;Solo uno o varios equipos
    </label>
    <div id="cg_equipos" style="margin-top:10px;max-height:180px;overflow-y:auto;display:none">${listaEquiposHtml(TOURNAMENT_DEFAULT)}</div>
    <label class="field" style="margin-top:14px">Nombre del administrador del grupo</label>
    <input class="input" id="cg_admin_nombre" maxlength="60" placeholder="Nombre de contacto">
    <label class="field" style="margin-top:10px">Celular del administrador</label>
    <input class="input" id="cg_admin_cel" maxlength="20" placeholder="Ej: 3001234567">
    <label class="field" style="margin-top:10px">Correo del administrador</label>
    <input class="input" id="cg_admin_correo" type="email" maxlength="60" placeholder="correo@ejemplo.com">
    <label class="field" style="margin-top:10px">PIN de administrador (déjalo vacío para generar uno al azar)</label>
    <input class="input" id="cg_pin" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:.3em;font-size:20px;text-align:center">
    <div id="cg_err" style="color:var(--flare);font-size:12px;min-height:18px;margin-top:8px;text-align:center"></div>
    <button class="btn" id="cg_crear" style="margin-top:10px">Crear</button>
    <button class="btn ghost" id="cg_cancelar" style="margin-top:10px">Cancelar</button>
  </div>`;
  document.getElementById("cg_torneo").onchange=(e)=>{
    document.getElementById("cg_equipos").innerHTML=listaEquiposHtml(e.target.value);
  };
  document.querySelectorAll('input[name="cg_modo"]').forEach(r=>{
    r.onchange=()=>{document.getElementById("cg_equipos").style.display=r.value==="equipo"&&r.checked?"block":"none";};
  });
  document.getElementById("cg_cancelar").onclick=()=>ov.remove();
  document.getElementById("cg_crear").onclick=async()=>{
    const err=document.getElementById("cg_err");
    const grupoId=document.getElementById("cg_id").value.trim();
    const nombreGrupo=document.getElementById("cg_nombre").value.trim();
    const torneoId=document.getElementById("cg_torneo").value;
    const modoSeguimiento=document.querySelector('input[name="cg_modo"]:checked').value;
    const equiposSeguidos=[...document.querySelectorAll(".cg_eq:checked")].map(cb=>cb.value);
    const nombreAdmin=document.getElementById("cg_admin_nombre").value.trim();
    const celularAdmin=document.getElementById("cg_admin_cel").value.trim();
    const correoAdmin=document.getElementById("cg_admin_correo").value.trim();
    const pin=document.getElementById("cg_pin").value.trim();
    if(!grupoId||!/^[a-zA-Z0-9_-]{1,40}$/.test(grupoId)){err.textContent="ID de grupo inválido (solo letras, números, guiones).";return;}
    if(!nombreGrupo){err.textContent="Falta el nombre del grupo.";return;}

  const old=document.getElementById("ovl");if(old)old.remove();

  document.body.appendChild(ov);
  const link=`${location.origin}/?grupo=${grupoId}`;
  ov.innerHTML=`<div class="card" style="border-color:var(--mint)">
    <div class="kicker" style="color:var(--mint)">Grupo creado ✓</div>
    <h2>${escapeHtml(nombreGrupo)}</h2>

    if(r&&r.status==="success"){PC_grupos=r.grupos||[];renderPanelCentralMain();}
  };
}

/* --- Boot --- */
(async function boot(){
  if(ES_PANEL_CENTRAL){ bootPanelCentral(); return; }
  try{
    S.allPreds={};
    S.me=await getJSON("me",false);
    S.mePinHash=S.me?localStorage.getItem("pg_pinp_"+TAB+"_"+S.me.id):null;
    S.organizer=(await getJSON("organizer",false))||false;
    S.organizerPinHash=S.organizer?localStorage.getItem("pg_pinhash_"+TAB):null;
    const conectado=await fetchAllShared();
    if(!conectado){ showErrorConexion(); return; }
    S.torneoId=(await getJSON("torneoId",true))||TOURNAMENT_DEFAULT; // grupos anteriores a este catálogo (ej. JorgeLozano) caen al torneo por defecto
    await activarTorneo(S.torneoId);
    S.modoSeguimiento=(await getJSON("modoSeguimiento",true))||"torneo";
    S.equiposSeguidos=(await getJSON("equiposSeguidos",true))||[];
    S.results=(await getJSON("results",true))||{};
    S.custom=(await getJSON("custom",true))||[];
    S.roster=(await getJSON("roster",true))||[];
    S.groupName=await getJSON("groupName",true);
    S.teamOverrides=(await getJSON("teamOverrides",true))||{};
    S.live=(await getJSON("live",true))||{};
    S.betting=(await getJSON("betting",true))||{inscripcion:0,premios:{p1:0,p2:0,p3:0}};
    if(S.me){
      S.predsMe=(await getJSON("preds_"+S.me.id,true))||{};
      const yaEnRoster=S.roster.some(p=>p.id===S.me.id&&p.name===S.me.name&&p.ico===S.me.ico);
      if(!yaEnRoster)await joinRoster();
    }
    for(const pl of S.roster)S.allPreds[pl.id]=(await getJSON("preds_"+pl.id,true))||{};
    if(S.me)S.allPreds[S.me.id]=Object.assign({},S.predsMe);
    
    if(!S.groupName){
      showGrupoNoEncontrado();
      return;
    }
    
    renderShell();renderView();
    if(!S.me)showOnboarding(false);
    // Sesiones que quedaron activas antes de este cambio de seguridad tienen
    // "me" guardado pero nunca guardaron el hash del PIN localmente (no
    // existía esa clave) — se les pide reconfirmar su PIN una sola vez; el
    // servidor ya lo tiene guardado, así que solo valida y lo cachea.
    else if(!S.mePinHash)showOnboarding(true);
  }catch(e){console.error("Boot error:",e);renderShell();renderView();}
})();
</script>
